<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>EduSync — Smart Examination Coordination &amp; Staff Alerts</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js" crossorigin></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
        colors: {
          brand: {
            navy: '#1E3A8A',
            blue: '#2563EB',
            teal: '#0D9488',
            success: '#16A34A',
            warning: '#F59E0B',
            danger: '#DC2626',
            info: '#0284C7',
            purple: '#7C3AED',
            orange: '#EA580C',
          }
        }
      }
    }
  };
</script>
<style>
  html, body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  #root { min-height: 100vh; }
  * { scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  .focus-ring:focus-visible { outline: 2px solid #2563EB; outline-offset: 2px; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .anim-fade { animation: fadeIn 0.18s ease-out; }
  .anim-slide { animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1); }
</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
<div id="root"></div>

<script type="text/babel" data-type="module">
const { useState, useEffect } = React;

/* ============================= ICONS ============================= */
const Icon = ({ children, size = 20, className = "" }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" className={className}>
    {children}
  </svg>
);
const IconCalendar = (p) => <Icon {...p}><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></Icon>;
const IconUsers = (p) => <Icon {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Icon>;
const IconFileText = (p) => <Icon {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></Icon>;
const IconBell = (p) => <Icon {...p}><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></Icon>;
const IconClock = (p) => <Icon {...p}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></Icon>;
const IconMapPin = (p) => <Icon {...p}><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/></Icon>;
const IconCheckCircle = (p) => <Icon {...p}><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 5-5"/></Icon>;
const IconXCircle = (p) => <Icon {...p}><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/></Icon>;
const IconTrash = (p) => <Icon {...p}><polyline points="3,6 5,6 21,6"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></Icon>;
const IconAlertTriangle = (p) => <Icon {...p}><path d="M12 3l9.5 17H2.5z"/><line x1="12" y1="9.5" x2="12" y2="14"/><circle cx="12" cy="17.2" r="0.6" fill="currentColor" stroke="none"/></Icon>;
const IconInfo = (p) => <Icon {...p}><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="7.6" r="0.6" fill="currentColor" stroke="none"/></Icon>;
const IconSync = (p) => <Icon {...p}><path d="M21 12a9 9 0 0 1-15.5 6.4L3 16"/><path d="M3 12a9 9 0 0 1 15.5-6.4L21 8"/><path d="M3 16v4h4"/><path d="M21 8V4h-4"/></Icon>;
const IconPlus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
const IconSend = (p) => <Icon {...p}><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></Icon>;
const IconUserPlus = (p) => <Icon {...p}><path d="M14 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="8" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></Icon>;
const IconClipboard = (p) => <Icon {...p}><path d="M9 3.5h6a1 1 0 0 1 1 1V6H8V4.5a1 1 0 0 1 1-1z"/><rect x="5" y="4.5" width="14" height="17" rx="2"/><line x1="9" y1="11.5" x2="15" y2="11.5"/><line x1="9" y1="15.5" x2="15" y2="15.5"/></Icon>;
const IconHome = (p) => <Icon {...p}><path d="M3 11.5l9-8 9 8"/><path d="M5 10v10.5h14V10"/></Icon>;
const IconActivity = (p) => <Icon {...p}><polyline points="3,12 8,12 11,20 14,4 17,12 21,12"/></Icon>;
const IconChevronRight = (p) => <Icon {...p}><polyline points="9,6 15,12 9,18"/></Icon>;
const IconCheck = (p) => <Icon {...p}><polyline points="5,13 10,18 19,7"/></Icon>;
const IconX = (p) => <Icon {...p}><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></Icon>;
const IconEdit = (p) => <Icon {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></Icon>;
const IconEye = (p) => <Icon {...p}><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></Icon>;
const IconSearch = (p) => <Icon {...p}><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Icon>;
const IconUserX = (p) => <Icon {...p}><path d="M13 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="7" cy="7" r="4"/><line x1="17" y1="8" x2="22" y2="13"/><line x1="22" y1="8" x2="17" y2="13"/></Icon>;
const IconUserCheck = (p) => <Icon {...p}><path d="M13 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="7" cy="7" r="4"/><polyline points="16,11 18,13 22,9"/></Icon>;
const IconUpload = (p) => <Icon {...p}><path d="M12 16V4"/><polyline points="7,9 12,4 17,9"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></Icon>;
const IconDownload = (p) => <Icon {...p}><path d="M12 4v12"/><polyline points="7,11 12,16 17,11"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></Icon>;
const IconSheet = (p) => <Icon {...p}><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="9" x2="9" y2="21"/><line x1="15" y1="9" x2="15" y2="21"/></Icon>;
const IconRepeat = (p) => <Icon {...p}><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></Icon>;
const IconArrowRight = (p) => <Icon {...p}><line x1="4" y1="12" x2="20" y2="12"/><polyline points="14,6 20,12 14,18"/></Icon>;

/* Activity/audit records are persisted to storage, so they store an icon KEY (string) rather than a
   component reference — components aren't JSON-serializable. This registry resolves keys back to
   components at render time. */
const ICON_REGISTRY = {
  edit: IconEdit, userPlus: IconUserPlus, calendar: IconCalendar, sync: IconSync, upload: IconUpload,
  checkCircle: IconCheckCircle, mapPin: IconMapPin, users: IconUsers, xCircle: IconXCircle,
  alertTriangle: IconAlertTriangle, userX: IconUserX, userCheck: IconUserCheck, send: IconSend,
  repeat: IconRepeat, info: IconInfo, bell: IconBell, fileText: IconFileText, activity: IconActivity, trash: IconTrash,
};
const resolveIcon = (key) => ICON_REGISTRY[key] || IconInfo;

/* ============================= COLOR / STATUS SYSTEM ============================= */
const colorMap = {
  blue:    { bg: "bg-brand-blue/10",    text: "text-brand-blue" },
  teal:    { bg: "bg-brand-teal/10",    text: "text-brand-teal" },
  purple:  { bg: "bg-brand-purple/10",  text: "text-brand-purple" },
  orange:  { bg: "bg-brand-orange/10",  text: "text-brand-orange" },
  success: { bg: "bg-brand-success/10", text: "text-brand-success" },
  warning: { bg: "bg-brand-warning/10", text: "text-brand-warning" },
  danger:  { bg: "bg-brand-danger/10",  text: "text-brand-danger" },
  info:    { bg: "bg-brand-info/10",    text: "text-brand-info" },
  slate:   { bg: "bg-slate-100",        text: "text-slate-500" },
};

const STATUS_CONFIG = {
  Scheduled:      { color: "blue",    icon: IconCalendar },
  Upcoming:       { color: "blue",    icon: IconClock },
  "In Progress":  { color: "orange",  icon: IconActivity },
  Completed:      { color: "success", icon: IconCheckCircle },
  Cancelled:      { color: "danger",  icon: IconXCircle },
  Active:         { color: "success", icon: IconCheckCircle },
  Deactivated:    { color: "slate",   icon: IconXCircle },
  Pending:        { color: "warning", icon: IconClock },
  "Reminder Active": { color: "orange", icon: IconBell },
  Due:            { color: "orange",  icon: IconBell },
  Sent:           { color: "success", icon: IconCheckCircle },
  Failed:         { color: "danger",  icon: IconXCircle },
};

/* ============================= REUSABLE COMPONENTS ============================= */
const IconContainer = ({ icon: IconComp, color = "blue", size = "md" }) => {
  const c = colorMap[color] || colorMap.blue;
  const box = size === "sm" ? "w-8 h-8" : size === "lg" ? "w-12 h-12" : "w-10 h-10";
  const iconSize = size === "sm" ? 16 : size === "lg" ? 22 : 18;
  return (
    <div className={`flex-shrink-0 ${box} ${c.bg} ${c.text} rounded-xl flex items-center justify-center`}>
      <IconComp size={iconSize} />
    </div>
  );
};

const StatusBadge = ({ status }) => {
  const cfg = STATUS_CONFIG[status] || STATUS_CONFIG.Pending;
  const c = colorMap[cfg.color];
  const IconComp = cfg.icon;
  return (
    <span className={`inline-flex items-center gap-1.5 ${c.bg} ${c.text} text-xs font-semibold px-2.5 py-1 rounded-full whitespace-nowrap`}>
      <IconComp size={13} />
      {status}
    </span>
  );
};

const Logo = ({ compact = false, variant = "dark" }) => (
  <div className="flex items-center gap-2.5">
    <div className="w-9 h-9 rounded-xl bg-brand-blue flex items-center justify-center flex-shrink-0 relative">
      <IconCalendar size={18} className="text-white" />
      <div className={`absolute -bottom-1 -right-1 w-4 h-4 rounded-full bg-brand-teal flex items-center justify-center ring-2 ${variant === "light" ? "ring-brand-navy" : "ring-white"}`}>
        <IconCheck size={9} className="text-white" />
      </div>
    </div>
    {!compact && (
      <div className="leading-tight">
        <div className={`font-extrabold text-base tracking-tight ${variant === "light" ? "text-white" : "text-slate-900"}`}>EduSync</div>
        <div className={`text-[10px] font-medium -mt-0.5 ${variant === "light" ? "text-blue-200/70" : "text-slate-500"}`}>Exam Coordination</div>
      </div>
    )}
  </div>
);

const DemoModeBadge = ({ className = "" }) => (
  <div className={`inline-flex items-center gap-1.5 bg-amber-50 text-amber-700 border border-amber-200 text-[11px] font-semibold px-2.5 py-1 rounded-full whitespace-nowrap ${className}`}>
    <span className="w-1.5 h-1.5 rounded-full bg-amber-500 flex-shrink-0"></span>
    DEMO / MVP SIMULATION
  </div>
);

/* The Demo Clock is purely a simulated "current time" for testing reminders — advancing it never
   rewrites any examination's date/start/end time. It only changes what counts as "due". */
const DemoClockPanel = ({ demoClock, onAdvance, onProcessDue, dueCount, variant = "dark" }) => {
  const light = variant === "light";
  const chipClass = light
    ? "bg-white/10 text-white hover:bg-white/20"
    : "bg-white border border-slate-200 text-slate-600 hover:bg-slate-100";
  return (
    <div className={`rounded-xl p-3 ${light ? "bg-white/10" : "bg-slate-50 border border-slate-200"}`}>
      <div className={`flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wide ${light ? "text-blue-200/80" : "text-slate-400"}`}>
        <IconClock size={12} /> Demo Clock
      </div>
      <div className={`text-sm font-extrabold mt-1 ${light ? "text-white" : "text-slate-800"}`}>{formatDateTimeDisplay(demoClock)}</div>
      <div className="flex flex-wrap gap-1.5 mt-2">
        <button onClick={() => onAdvance(15 * 60 * 1000)} className={`focus-ring text-[11px] font-semibold px-2 py-1 rounded-lg transition-colors duration-150 ${chipClass}`}>+15m</button>
        <button onClick={() => onAdvance(60 * 60 * 1000)} className={`focus-ring text-[11px] font-semibold px-2 py-1 rounded-lg transition-colors duration-150 ${chipClass}`}>+1h</button>
        <button onClick={() => onAdvance(24 * 60 * 60 * 1000)} className={`focus-ring text-[11px] font-semibold px-2 py-1 rounded-lg transition-colors duration-150 ${chipClass}`}>+24h</button>
      </div>
      <button onClick={onProcessDue}
        className={`focus-ring mt-2 w-full text-xs font-semibold px-2 py-2 rounded-lg flex items-center justify-center gap-1.5 transition-colors duration-150 ${
          dueCount > 0 ? "bg-brand-orange text-white hover:bg-orange-600" : (light ? "bg-white/10 text-blue-100" : "bg-slate-100 text-slate-500")
        }`}>
        <IconBell size={13} /> Process Due Reminders{dueCount > 0 ? ` (${dueCount})` : ""}
      </button>
    </div>
  );
};

const Button = ({ children, variant = "primary", onClick, className = "", icon: IconComp, type = "button", disabled = false }) => {
  const base = "focus-ring inline-flex items-center justify-center gap-2 font-semibold rounded-xl px-4 py-2.5 text-sm transition-colors duration-150 disabled:opacity-50 disabled:cursor-not-allowed";
  const variants = {
    primary: "bg-brand-blue text-white hover:bg-blue-700 active:bg-blue-800",
    secondary: "bg-white text-slate-700 border border-slate-200 hover:bg-slate-50 active:bg-slate-100",
    ghost: "text-slate-600 hover:bg-slate-100",
    danger: "bg-brand-danger text-white hover:bg-red-700 active:bg-red-800",
    success: "bg-brand-success text-white hover:bg-green-700 active:bg-green-800",
  };
  return (
    <button type={type} onClick={onClick} disabled={disabled} className={`${base} ${variants[variant]} ${className}`}>
      {IconComp && <IconComp size={16} />}
      {children}
    </button>
  );
};

const IconActionBtn = ({ icon: IconComp, onClick, title, danger, success }) => (
  <button onClick={onClick} title={title} aria-label={title}
    className={`focus-ring w-8 h-8 rounded-lg flex items-center justify-center transition-colors duration-150 ${
      danger ? "text-brand-danger hover:bg-brand-danger/10" : success ? "text-brand-success hover:bg-brand-success/10" : "text-slate-400 hover:bg-slate-100 hover:text-slate-700"
    }`}>
    <IconComp size={15} />
  </button>
);

const SectionHeader = ({ title, subtitle, action }) => (
  <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-3 mb-4">
    <div>
      <h2 className="text-lg font-bold text-slate-900">{title}</h2>
      {subtitle && <p className="text-sm text-slate-500 mt-0.5">{subtitle}</p>}
    </div>
    {action}
  </div>
);

const Card = ({ children, className = "" }) => (
  <div className={`bg-white rounded-2xl border border-slate-200 ${className}`}>{children}</div>
);

const DashboardCard = ({ title, value, icon, color, hint }) => (
  <Card className="p-5 hover:border-slate-300 transition-colors duration-150">
    <div className="flex items-start justify-between">
      <div>
        <div className="text-sm text-slate-500 font-medium">{title}</div>
        <div className="text-3xl font-extrabold text-slate-900 mt-1.5">{value}</div>
        {hint && <div className="text-xs text-slate-400 mt-1.5">{hint}</div>}
      </div>
      <IconContainer icon={icon} color={color} size="lg" />
    </div>
  </Card>
);

const AlertCard = ({ icon: IconComp, color, type, description, time }) => {
  const c = colorMap[color];
  return (
    <div className="flex items-start gap-3 p-4 rounded-xl border border-slate-100 hover:border-slate-200 hover:bg-slate-50/60 transition-colors duration-150">
      <IconContainer icon={IconComp} color={color} size="sm" />
      <div className="flex-1 min-w-0">
        <span className="font-semibold text-slate-800 text-sm">{type}</span>
        <p className="text-sm text-slate-600 mt-0.5 leading-snug">{description}</p>
        <div className="flex items-center gap-1 text-xs text-slate-400 mt-1.5">
          <IconClock size={12} />
          {time}
        </div>
      </div>
    </div>
  );
};

const EmptyState = ({ icon: IconComp, color = "blue", title, description, actionLabel, onAction }) => (
  <div className="flex flex-col items-center text-center py-14 px-6">
    <IconContainer icon={IconComp} color={color} size="lg" />
    <h3 className="text-base font-bold text-slate-800 mt-4">{title}</h3>
    <p className="text-sm text-slate-500 mt-1.5 max-w-sm">{description}</p>
    {actionLabel && (
      <Button variant="secondary" className="mt-5" icon={IconPlus} onClick={onAction}>
        {actionLabel}
      </Button>
    )}
  </div>
);

const Modal = ({ open, onClose, title, description, icon: IconComp = IconSync, color = "blue" }) => {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 anim-fade" style={{ background: "rgba(15,23,42,0.45)" }} onClick={onClose}>
      <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 anim-slide" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-start justify-between">
          <IconContainer icon={IconComp} color={color} size="lg" />
          <button onClick={onClose} className="focus-ring text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg p-1.5 transition-colors duration-150" aria-label="Close">
            <IconX size={18} />
          </button>
        </div>
        <h3 className="text-lg font-bold text-slate-900 mt-4">{title}</h3>
        <p className="text-sm text-slate-500 mt-2 leading-relaxed">{description}</p>
        <div className="mt-5 flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-500">
          <IconInfo size={14} className="text-slate-400 flex-shrink-0" />
          This will be available in a future build stage of EduSync.
        </div>
        <Button variant="primary" className="w-full mt-5" onClick={onClose}>Got it</Button>
      </div>
    </div>
  );
};

const ConfirmDialog = ({ open, icon: IconComp = IconAlertTriangle, color = "danger", title, message, note, confirmLabel = "Confirm", cancelLabel = "Cancel", onConfirm, onCancel }) => {
  if (!open) return null;
  const confirmVariant = color === "danger" ? "danger" : color === "success" ? "success" : "primary";
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 anim-fade" style={{ background: "rgba(15,23,42,0.45)" }} onClick={onCancel}>
      <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 anim-slide" onClick={(e) => e.stopPropagation()}>
        <IconContainer icon={IconComp} color={color} size="lg" />
        <h3 className="text-lg font-bold text-slate-900 mt-4">{title}</h3>
        <p className="text-sm text-slate-500 mt-2 leading-relaxed">{message}</p>
        {note && (
          <div className="mt-4 flex items-start gap-2 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs text-slate-500 leading-relaxed">
            <IconInfo size={14} className="text-slate-400 flex-shrink-0 mt-0.5" />
            {note}
          </div>
        )}
        <div className="flex gap-3 mt-6">
          <Button variant="secondary" className="flex-1" onClick={onCancel}>{cancelLabel}</Button>
          <Button variant={confirmVariant} className="flex-1" onClick={onConfirm}>{confirmLabel}</Button>
        </div>
      </div>
    </div>
  );
};

const Toast = ({ message, onClose }) => {
  if (!message) return null;
  return (
    <div className="fixed bottom-24 md:bottom-6 left-1/2 -translate-x-1/2 z-[60] anim-slide px-4 w-full sm:w-auto flex justify-center">
      <div className="flex items-center gap-2.5 bg-slate-900 text-white text-sm font-medium px-4 py-3 rounded-xl shadow-lg max-w-[92vw]">
        <IconCheckCircle size={16} className="text-brand-success flex-shrink-0" />
        <span>{message}</span>

const stripPhone = (s = "") => String(s).replace(/[\s-]/g, "");

const isValidNGPhone = (raw) => {
  const s = stripPhone(raw);
  return /^0[789]\d{9}$/.test(s) || /^\+234[789]\d{9}$/.test(s) || /^234[789]\d{9}$/.test(s);
};

const normalizePhone = (raw) => {
  let s = stripPhone(raw);
  if (s.startsWith("+234")) s = "0" + s.slice(4);
  else if (s.startsWith("234") && s.length === 13) s = "0" + s.slice(3);
  return s;
};

const formatPhoneDisplay = (raw) => {
  const s = normalizePhone(raw);
  if (s.length === 11) return `${s.slice(0, 4)} ${s.slice(4, 7)} ${s.slice(7)}`;
  return raw;
};

const getActiveStaff = (list) => list.filter((s) => s.status === "Active");

const searchStaff = (list, query) => {
  const q = query.trim().toLowerCase();
  if (!q) return list;
  const qDigits = stripPhone(q);
  return list.filter((s) =>
    s.fullName.toLowerCase().includes(q) ||
    (qDigits && stripPhone(s.phoneNumber).includes(qDigits)) ||
    (qDigits && stripPhone(s.whatsappNumber).includes(qDigits))
  );
};

const filterStaff = (list, { status = "All", role = "All" } = {}) =>
  list.filter((s) => (status === "All" || s.status === status) && (role === "All" || s.role === role));

const findDuplicatePhone = (list, normalized, excludeId) =>
  list.find((s) => s.id !== excludeId && (normalizePhone(s.phoneNumber) === normalized || normalizePhone(s.whatsappNumber) === normalized));

const validateStaffForm = ({ fullName, phoneNumber, whatsappNumber, sameAsPhone, role }, staffList, excludeId) => {
  const errors = {};
  if (!fullName || !fullName.trim()) errors.fullName = "Please enter the staff member's full name.";
  if (!phoneNumber || !phoneNumber.trim()) errors.phoneNumber = "Please enter a phone number.";
  else if (!isValidNGPhone(phoneNumber)) errors.phoneNumber = "Please enter a valid Nigerian phone number.";

  if (!sameAsPhone) {
    if (!whatsappNumber || !whatsappNumber.trim()) errors.whatsappNumber = "Please enter a WhatsApp number.";
    else if (!isValidNGPhone(whatsappNumber)) errors.whatsappNumber = "Please enter a valid Nigerian phone number.";
  }
  if (!role) errors.role = "Please select a staff role.";

  if (!errors.phoneNumber && phoneNumber) {
    const dup = findDuplicatePhone(staffList, normalizePhone(phoneNumber), excludeId);
    if (dup) errors.phoneNumber = "This phone number is already registered to another staff member.";
  }
  if (!sameAsPhone && !errors.whatsappNumber && whatsappNumber) {
    const dupW = findDuplicatePhone(staffList, normalizePhone(whatsappNumber), excludeId);
    if (dupW) errors.whatsappNumber = "This phone number is already registered to another staff member.";
  }
  return errors;
};

/* ============================= EXAMINATION DOMAIN: MODEL, UTILITIES, SERVICES ============================= */
/* Exam record shape: { id, subject, className, date(ISO), startTime, endTime, venue, invigilatorIds[], notes, status, source, externalKey, createdAt, updatedAt } */
const EXAM_STATUSES = ["Scheduled", "Completed", "Cancelled"];
const EXAM_SOURCES = ["Manual", "Excel Import", "Excel Sync"];

const normalizeStr = (s) => String(s || "").trim().toLowerCase().replace(/\s+/g, " ");

/* Stable identity used for plain-import duplicate detection: Subject + Class + Date + Start Time + Venue */
const buildExternalKey = (subject, className, date, startTime, venue) =>
  [normalizeStr(subject), normalizeStr(className), date, startTime, normalizeStr(venue)].join("|");

/* Looser identity used for Sync matching — a timetable slot keeps its identity across date/time/venue edits. */
const buildIdentityKey = (subject, className) => `${normalizeStr(subject)}|${normalizeStr(className)}`;

const pad2 = (n) => String(n).padStart(2, "0");
const toISODate = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;

/* Demo clock: EduSync's fixed "today" for this simulation build. The future reminder engine will read from this same clock. */
const REF_TODAY = new Date(2026, 8, 7);
const TODAY_ISO = toISODate(REF_TODAY);

const timeToMinutes = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const rangesOverlap = (aStart, aEnd, bStart, bEnd) => timeToMinutes(aStart) < timeToMinutes(bEnd) && timeToMinutes(bStart) < timeToMinutes(aEnd);
const parseExamDateTime = (dateStr, timeStr) => {
  const [y, m, d] = dateStr.split("-").map(Number);
  const [h, min] = timeStr.split(":").map(Number);
  return new Date(y, m - 1, d, h, min);
};
const formatDateDisplay = (dateStr) => {
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
};
const formatDateFull = (dateStr) => {
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
};
const formatTime12 = (t) => {
  const [h, m] = t.split(":").map(Number);
  const period = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${pad2(m)} ${period}`;
};
const formatTimeRange = (s, e) => `${formatTime12(s)} – ${formatTime12(e)}`;
const formatDateTimeDisplay = (d) => (d instanceof Date ? d : new Date(d)).toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

const startOfWeek = (d) => { const dt = new Date(d); const day = dt.getDay(); const diff = (day === 0 ? -6 : 1) - day; dt.setDate(dt.getDate() + diff); dt.setHours(0, 0, 0, 0); return dt; };
const endOfWeek = (d) => { const s = startOfWeek(d); const e = new Date(s); e.setDate(s.getDate() + 6); e.setHours(23, 59, 59, 999); return e; };
const isDateInRange = (dateStr, start, end) => { const [y, m, d] = dateStr.split("-").map(Number); const dt = new Date(y, m - 1, d); return dt >= start && dt <= end; };

/* Computed, display-only status for an exam "in the moment" — never mutates the stored `status`.
   Scheduled exams are shown as Upcoming / In Progress / Completed relative to the Demo Clock;
   Cancelled and (already) Completed exams simply show their real stored status. */
const getExamDisplayStatus = (exam, demoClock) => {
  if (exam.status !== "Scheduled") return exam.status;
  const start = parseExamDateTime(exam.date, exam.startTime);
  const end = parseExamDateTime(exam.date, exam.endTime);
  if (demoClock < start) return "Upcoming";
  if (demoClock <= end) return "In Progress";
  return "Completed";
};

const EXAM_TABS = [
  { id: "all", label: "All" },
  { id: "today", label: "Today" },
  { id: "week", label: "This Week" },
  { id: "upcoming", label: "Upcoming" },
  { id: "completed", label: "Completed" },
  { id: "cancelled", label: "Cancelled" },
];

const filterExamsByTab = (list, tab) => {
  const weekStart = startOfWeek(REF_TODAY), weekEnd = endOfWeek(REF_TODAY);
  switch (tab) {
    case "today": return list.filter(e => e.status === "Scheduled" && e.date === TODAY_ISO);
    case "week": return list.filter(e => e.status === "Scheduled" && isDateInRange(e.date, weekStart, weekEnd));
    case "upcoming": return list.filter(e => e.status === "Scheduled" && e.date > TODAY_ISO);
    case "completed": return list.filter(e => e.status === "Completed");
    case "cancelled": return list.filter(e => e.status === "Cancelled");
    default: return list;
  }
};

const searchExams = (list, staffList, query) => {
  const q = query.trim().toLowerCase();
  if (!q) return list;
  return list.filter(e => {
    const names = e.invigilatorIds.map(id => { const s = staffList.find(x => x.id === id); return s ? s.fullName.toLowerCase() : ""; }).join(" ");
    return e.subject.toLowerCase().includes(q) || e.className.toLowerCase().includes(q) || e.venue.toLowerCase().includes(q) || names.includes(q);
  });
};

/* Reusable conflict-detection service — used on create, edit, reschedule, and invigilator add/remove. */
const getConflicts = (list, candidate, staffList) => {
  const conflicts = [];
  candidate.invigilatorIds.forEach(staffId => {
    list.forEach(e => {
      if (e.id === candidate.id) return;
      if (e.status === "Cancelled") return;
      if (e.date !== candidate.date) return;
      if (!e.invigilatorIds.includes(staffId)) return;
      if (!rangesOverlap(candidate.startTime, candidate.endTime, e.startTime, e.endTime)) return;
      const staff = staffList.find(s => s.id === staffId);
      conflicts.push({
        staffId, staffName: staff ? staff.fullName : "Unknown",
        examId: e.id, subject: e.subject, className: e.className,
        date: e.date, startTime: e.startTime, endTime: e.endTime,
      });
    });
  });
  return conflicts;
};

const validateExamForm = ({ subject, className, date, startTime, endTime, venue, invigilatorIds }) => {
  const errors = {};
  if (!subject || !subject.trim()) errors.subject = "Please enter the examination subject.";
  if (!className || !className.trim()) errors.className = "Please enter the class.";
  if (!date) errors.date = "Please select an examination date.";
  if (!startTime) errors.startTime = "Please select a start time.";
  if (!endTime) errors.endTime = "Please select an end time.";
  if (startTime && endTime && timeToMinutes(endTime) <= timeToMinutes(startTime)) errors.endTime = "End time must be later than start time.";
  if (!venue || !venue.trim()) errors.venue = "Please enter the examination venue.";
  if (!invigilatorIds || invigilatorIds.length === 0) errors.invigilators = "Please assign at least one invigilator.";
  return errors;
};

/* ============================= REMINDER & NOTIFICATION ENGINE ============================= */
/* This is a DEMO engine: it generates and processes simulated notifications only — no real
   WhatsApp/SMS delivery. Every notification carries a `channel` field ("Demo" for now) so a real
   channel can be plugged in later without touching this logic. */
const REMINDER_OFFSETS = [
  { type: "24h", label: "24-Hour Invigilation Reminder", ms: 24 * 60 * 60 * 1000 },
  { type: "1h", label: "1-Hour Invigilation Reminder", ms: 60 * 60 * 1000 },
  { type: "15m", label: "15-Minute Invigilation Reminder", ms: 15 * 60 * 1000 },
];

/* Deterministic reminder IDs (exam + staff + type + schedule version) — re-running this for the same
   version always yields the same IDs, so reload/re-import/re-sync can never create duplicate Pending
   reminders. A version bump (on reschedule) changes the ID, so old and new reminders never collide. */
const buildReminders = (exam) => {
  const examStart = parseExamDateTime(exam.date, exam.startTime);
  const version = exam.scheduleVersion || 1;
  const nowIso = new Date().toISOString();
  const reminders = [];
  exam.invigilatorIds.forEach(staffId => {
    REMINDER_OFFSETS.forEach(off => {
      reminders.push({
        id: `${exam.id}-${staffId}-${off.type}-v${version}`,
        kind: "exam", examId: exam.id, invigilatorId: staffId, type: off.type, label: off.label,
        scheduledAt: new Date(examStart.getTime() - off.ms),
        status: "Pending", channel: "Demo WhatsApp", scheduleVersion: version, createdAt: nowIso, sentAt: null,
      });
    });
  });
  return reminders;
};

/* "Due" is a computed view, not a stored status — a Pending reminder is Due once its scheduled time
   has passed on the Demo Clock, until "Process Due Reminders" flips it to Sent. */
const getReminderDisplayStatus = (reminder, demoClock) =>
  reminder.status === "Pending" && reminder.scheduledAt <= demoClock ? "Due" : reminder.status;

/* ---- Notification message templates (Section 11–15) ---- */
const buildInvigilationReminderMessage = (type, exam) => {
  const time = formatTime12(exam.startTime);
  if (type === "24h") return `EduSync Reminder: You are scheduled to invigilate the ${exam.subject} examination for ${exam.className} tomorrow at ${time} in ${exam.venue}.`;
  if (type === "1h") return `EduSync Reminder: You are scheduled to invigilate ${exam.subject} for ${exam.className} in 1 hour at ${exam.venue}. Examination time: ${time}.`;
  return `EduSync Reminder: ${exam.subject} for ${exam.className} starts in 15 minutes at ${exam.venue}. Examination time: ${time}.`;
};

const buildTimetableChangeMessage = (exam, diffs) => {
  const detail = diffs.map(d => `${d.field} changed from ${d.from} to ${d.to}`).join("; ");
  return `EduSync Timetable Update: The ${exam.subject} examination for ${exam.className} has changed — ${detail}. Please take note of the change.`;
};

const buildCancellationMessage = (exam) =>
  `EduSync Examination Update: The ${exam.subject} examination for ${exam.className} scheduled for ${formatDateFull(exam.date)} at ${formatTime12(exam.startTime)} has been cancelled.`;

const buildAssignmentAddedMessage = (exam) =>
  `EduSync Invigilation Update: You are now assigned to invigilate ${exam.subject} for ${exam.className} on ${formatDateFull(exam.date)} at ${formatTime12(exam.startTime)} in ${exam.venue}.`;

const buildAssignmentRemovedMessage = (exam) =>
  `EduSync Invigilation Update: You are no longer assigned to invigilate ${exam.subject} for ${exam.className} on ${formatDateFull(exam.date)} at ${formatTime12(exam.startTime)}.`;

/* Compares two {date,startTime,endTime,venue} shapes and returns what changed — shared by manual
   edit/reschedule and Excel Sync, so "what counts as a timetable change" is defined in one place. */
const diffExamFields = (before, after) => {
  const diffs = [];
  if (before.date !== after.date || before.startTime !== after.startTime || before.endTime !== after.endTime) {
    diffs.push({
      field: "Date/Time",
      from: `${formatDateDisplay(before.date)}, ${formatTimeRange(before.startTime, before.endTime)}`,
      to: `${formatDateDisplay(after.date)}, ${formatTimeRange(after.startTime, after.endTime)}`,
      kind: "schedule",
    });
  }
  if (normalizeStr(before.venue) !== normalizeStr(after.venue)) {
    diffs.push({ field: "Venue", from: before.venue, to: after.venue, kind: "venue" });
  }
  return diffs;
};

let notificationSeq = 1;
const nextNotificationId = () => `n-${Date.now()}-${notificationSeq++}`;

/* One notification record per recipient — this is the shape a future WhatsApp/SMS channel will consume. */
const makeNotification = ({ staff, type, exam, submission, message, scheduledTime, sentAt, status = "Sent" }) => ({
  id: nextNotificationId(),
  recipientStaffId: staff.id,
  recipientName: staff.fullName,
  type,
  examId: exam ? exam.id : null,
  examLabel: exam ? `${exam.subject} — ${exam.className}` : (submission ? `${submission.subject} — ${submission.class}` : null),
  submissionId: submission ? submission.id : null,
  message: `${type} — ${staff.fullName}`,
  fullMessage: message,
  channel: "Demo WhatsApp",
  scheduledTime: scheduledTime ? scheduledTime.toISOString() : null,
  createdAt: new Date().toISOString(),
  sentAt: sentAt ? sentAt.toISOString() : null,
  status,
  time: sentAt ? formatDateTimeDisplay(sentAt) : "Pending",
});

/* Broadcasts go to every ACTIVE staff member — deactivated staff never receive new timetable-wide notices. */
const broadcastToActiveStaff = (staffList, exam, type, message, demoClock) =>
  getActiveStaff(staffList).map(staff => makeNotification({ staff, type, exam, message, scheduledTime: demoClock, sentAt: demoClock }));

const sendAssignmentChangeNotifications = (exam, staffList, addedIds, removedIds, demoClock) => {
  const notes = [];
  addedIds.forEach(id => {
    const staff = staffList.find(s => s.id === id);
    if (staff) notes.push(makeNotification({ staff, type: "Invigilator Assignment Change", exam, message: buildAssignmentAddedMessage(exam), scheduledTime: demoClock, sentAt: demoClock }));
  });
  removedIds.forEach(id => {
    const staff = staffList.find(s => s.id === id);
    if (staff) notes.push(makeNotification({ staff, type: "Invigilator Assignment Change", exam, message: buildAssignmentRemovedMessage(exam), scheduledTime: demoClock, sentAt: demoClock }));
  });
  return notes;
};

/* The core Demo Clock engine step: find every Pending reminder that is now Due, mark it Sent, and
   generate its notification. Handles both invigilation reminders (kind: "exam", the default for any
   reminder without a kind, for backward compatibility with data saved before Question Submissions
   existed) and submission reminders (kind: "submission"). Never touches Cancelled or already-Sent
   reminders. Pure function — the caller applies the returned pieces to state and activity log. */
const processDueReminders = (reminders, examsList, submissionsList, staffList, demoClock) => {
  const updatedReminders = [];
  const newNotifications = [];
  const activityEntries = [];

  reminders.forEach(r => {
    if (r.status !== "Pending" || r.scheduledAt > demoClock) { updatedReminders.push(r); return; }
    const staff = staffList.find(s => s.id === r.invigilatorId);

    if (r.kind === "submission") {
      const submission = submissionsList.find(s => s.id === r.submissionId);
      if (!submission || !staff) { updatedReminders.push({ ...r, status: "Failed" }); return; }
      updatedReminders.push({ ...r, status: "Sent", sentAt: demoClock.toISOString() });
      const message = buildSubmissionReminderMessage(r.type, submission);
      newNotifications.push(makeNotification({ staff, type: r.label, submission, message, scheduledTime: r.scheduledAt, sentAt: demoClock }));
      activityEntries.push({ text: `Submission reminder sent: ${r.label} — ${staff.fullName} — ${submission.subject} (${submission.class})`, iconKey: "bell", color: "orange", submissionId: submission.id, staffId: staff.id });
      return;
    }

    const exam = examsList.find(e => e.id === r.examId);
    if (!exam || !staff) { updatedReminders.push({ ...r, status: "Failed" }); return; }
    updatedReminders.push({ ...r, status: "Sent", sentAt: demoClock.toISOString() });
    const message = buildInvigilationReminderMessage(r.type, exam);
    newNotifications.push(makeNotification({ staff, type: r.label, exam, message, scheduledTime: r.scheduledAt, sentAt: demoClock }));
    activityEntries.push({ text: `Invigilation reminder sent: ${r.label} — ${staff.fullName} — ${exam.subject} (${exam.className})`, iconKey: "bell", color: "orange", examId: exam.id, staffId: staff.id });
  });

  return { updatedReminders, newNotifications, activityEntries };
};

/* ============================= DEMO CLOCK ============================= */
/* A simulated "current time" the administrator can advance to test reminders — it is compared
   against examination schedules, and NEVER writes back into them. Starts a little before the
   day's first exam so 24h/1h/15m reminders can all be demonstrated by advancing forward. */
const INITIAL_DEMO_CLOCK = new Date(2026, 8, 7, 7, 0);

/* Cross-cutting Important Alerts — derived from live conflicts + recent examination activity, never hardcoded. */
const computeDashboardAlerts = (examsList, staffList, activityLog, reminders, demoClock, notifications, submissionsList) => {
  const alerts = [];
  const scheduled = examsList.filter(e => e.status === "Scheduled");
  const seen = new Set();
  scheduled.forEach(e => {
    getConflicts(scheduled, e, staffList).forEach(c => {
      const key = [e.id, c.examId].sort().join("-") + "-" + c.staffId;
      if (seen.has(key)) return;
      seen.add(key);
      alerts.push({
        icon: IconAlertTriangle, color: "danger", type: "Invigilator Conflict",
        description: `${c.staffName} is double-booked: ${e.subject} (${e.className}) overlaps ${c.subject} (${c.className}) on ${formatDateDisplay(e.date)}.`,
        time: "Needs resolving",
      });
    });
  });

  const dueReminders = reminders.filter(r => getReminderDisplayStatus(r, demoClock) === "Due");
  if (dueReminders.length) {
    alerts.push({
      icon: IconBell, color: "orange", type: "Reminders Due",
      description: `${dueReminders.length} reminder${dueReminders.length === 1 ? " is" : "s are"} due — process them from the Reminder Engine.`,
      time: "Awaiting processing",
    });
  }

  activityLog.filter(a => a.examId && /cancelled|rescheduled|changed/i.test(a.text)).slice(0, 4).forEach(a => {
    alerts.push({
      icon: resolveIcon(a.iconKey), color: a.color,
      type: /cancelled/i.test(a.text) ? "Examination Cancelled" : /venue/i.test(a.text) ? "Venue Change" : /invigilator/i.test(a.text) ? "Invigilator Change" : "Timetable Change",
      description: a.text, time: a.time,
    });
  });

  submissionsList.filter(s => getSubmissionDisplayStatus(s, reminders, demoClock) === "Reminder Active").forEach(s => {
    alerts.push({
      icon: IconFileText, color: "purple", type: "Submission Deadline Approaching",
      description: `${s.subject} (${s.class}) question submission from ${s.teacherName} is due ${formatDateDisplay(s.deadlineDate)} at ${formatTime12(s.deadlineTime)}.`,
      time: formatDateDisplay(s.deadlineDate),
    });
  });

  const failedNotes = notifications.filter(n => n.status === "Failed");
  if (failedNotes.length) {
    alerts.push({
      icon: IconXCircle, color: "danger", type: "Notification Failed",
      description: `${failedNotes.length} simulated notification${failedNotes.length === 1 ? "" : "s"} failed to process — check the Notification Center.`,
      time: "Needs review",
    });
  }

  const soon = scheduled.filter(e => e.date >= TODAY_ISO).sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime))[0];
  if (soon) {
    alerts.push({
      icon: IconCalendar, color: "info", type: "Upcoming Examination",
      description: `${soon.subject} (${soon.className}) is scheduled for ${formatDateDisplay(soon.date)} at ${formatTime12(soon.startTime)}.`,
      time: soon.date === TODAY_ISO ? "Today" : formatDateDisplay(soon.date),
    });
  }
  return alerts;
};

/* Compact, action-oriented view of the same underlying signals as Important Alerts — each item
   points somewhere the admin can actually act. */
const computeAttentionItems = (examsList, staffList, reminders, demoClock, notifications, submissionsList) => {
  const items = [];
  const scheduled = examsList.filter(e => e.status === "Scheduled");
  const seen = new Set();
  scheduled.forEach(e => {
    getConflicts(scheduled, e, staffList).forEach(c => {
      const key = [e.id, c.examId].sort().join("-") + "-" + c.staffId;
      if (seen.has(key)) return;
      seen.add(key);
      items.push({ icon: IconAlertTriangle, color: "danger", text: `Invigilation conflict: ${c.staffName} — ${e.subject} vs ${c.subject}`, actionLabel: "Resolve in Examinations", nav: "examinations" });
    });
  });
  const dueCount = reminders.filter(r => getReminderDisplayStatus(r, demoClock) === "Due").length;
  if (dueCount) items.push({ icon: IconBell, color: "orange", text: `${dueCount} reminder${dueCount === 1 ? "" : "s"} due for processing`, actionLabel: "Open Reminder Engine", nav: "activity" });
  const failedCount = notifications.filter(n => n.status === "Failed").length;
  if (failedCount) items.push({ icon: IconXCircle, color: "danger", text: `${failedCount} notification${failedCount === 1 ? "" : "s"} failed to process`, actionLabel: "Review Notifications", nav: "activity" });
  const soon = scheduled.filter(e => { const diff = parseExamDateTime(e.date, e.startTime) - demoClock; return diff > 0 && diff <= 2 * 60 * 60 * 1000; })
    .sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime))[0];
  if (soon) items.push({ icon: IconClock, color: "info", text: `${soon.subject} (${soon.className}) starts soon — ${formatTime12(soon.startTime)}`, actionLabel: "View Examination", nav: "examinations" });
  submissionsList.filter(s => getSubmissionDisplayStatus(s, reminders, demoClock) === "Reminder Active").forEach(s => {
    items.push({ icon: IconFileText, color: "purple", text: `${s.subject} (${s.class}) submission from ${s.teacherName} due ${formatDateDisplay(s.deadlineDate)}`, actionLabel: "View Submissions", nav: "submissions" });
  });
  return items;
};

/* A short, prioritized "what to do next" list — nearest-in-time items first, derived only from real data. */
const computeNextActions = (examsList, staffList, reminders, demoClock, submissionsList) => {
  const actions = [];
  const scheduled = examsList.filter(e => e.status === "Scheduled" && parseExamDateTime(e.date, e.endTime) >= demoClock);
  const seen = new Set();
  scheduled.forEach(e => getConflicts(scheduled, e, staffList).forEach(c => {
    const key = [e.id, c.examId].sort().join("-") + "-" + c.staffId;
    if (seen.has(key)) return; seen.add(key);
    actions.push({ icon: IconAlertTriangle, color: "danger", text: `Resolve invigilation conflict: ${c.staffName} — ${e.subject} vs ${c.subject}` });
  }));
  const dueCount = reminders.filter(r => getReminderDisplayStatus(r, demoClock) === "Due").length;
  if (dueCount) actions.push({ icon: IconBell, color: "orange", text: `Process ${dueCount} due reminder${dueCount === 1 ? "" : "s"}` });
  const nextExam = scheduled.sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime))[0];
  if (nextExam) actions.push({ icon: IconCalendar, color: "blue", text: `${nextExam.subject} (${nextExam.className}) examination starts at ${formatTime12(nextExam.startTime)} on ${formatDateDisplay(nextExam.date)}` });
  const nextSub = submissionsList.filter(s => s.status === "Upcoming").sort((a, b) => new Date(a.deadlineDate + "T" + a.deadlineTime) - new Date(b.deadlineDate + "T" + b.deadlineTime))[0];
  if (nextSub) actions.push({ icon: IconFileText, color: "purple", text: `${nextSub.subject} (${nextSub.class}) question submission deadline is ${formatDateDisplay(nextSub.deadlineDate)} at ${formatTime12(nextSub.deadlineTime)}` });
  return actions.slice(0, 4);
};

/* ============================= EXCEL IMPORT & SYNC: PARSING + ANALYSIS SERVICE ============================= */
const EXCEL_TEMPLATE_HEADERS = ["Subject", "Class", "Date", "Start Time", "End Time", "Venue", "Invigilator 1", "Invigilator 2"];

const excelSerialToUTCDate = (serial) => new Date(Math.round((serial - 25569) * 86400 * 1000));

const parseExcelDateCell = (v) => {
  /* XLSX's cellDates:true builds Date objects from LOCAL wall-clock components (year/month/day as parsed
     from the spreadsheet), not from a UTC instant. Reading them back with getUTC*() re-interprets those
     local components through the runtime's UTC offset and silently shifts the value — that was the bug.
     Local getters mirror how the Date was constructed, so the value comes back unchanged. */
  if (v instanceof Date && !isNaN(v)) return toISODate(new Date(v.getFullYear(), v.getMonth(), v.getDate()));
  if (typeof v === "number") { const d = excelSerialToUTCDate(v); return toISODate(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); }
  if (typeof v === "string") {
    const s = v.trim();
    let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) return `${m[3]}-${pad2(+m[2])}-${pad2(+m[1])}`;
    m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) return `${m[1]}-${pad2(+m[2])}-${pad2(+m[3])}`;
    m = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
    if (m) return `${m[3]}-${pad2(+m[2])}-${pad2(+m[1])}`;
  }
  return null;
};

const parseExcelTimeCell = (v) => {
  /* Same fix as parseExcelDateCell: SheetJS gives us a local-component Date for time-formatted cells
     (e.g. "10:00"), so we must read it back with local getHours/getMinutes — not the UTC accessors —
     or the extracted time silently drifts by the runtime's UTC offset. */
  if (v instanceof Date && !isNaN(v)) return `${pad2(v.getHours())}:${pad2(v.getMinutes())}`;
  if (typeof v === "number") { const totalMin = Math.round((v % 1) * 24 * 60); return `${pad2(Math.floor(totalMin / 60))}:${pad2(totalMin % 60)}`; }
  if (typeof v === "string") {
    const s = v.trim();
    const m = s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM|am|pm)?$/);
    if (m) {
      let h = +m[1]; const min = +m[2]; const ap = (m[4] || "").toUpperCase();
      if (ap === "PM" && h < 12) h += 12;
      if (ap === "AM" && h === 12) h = 0;
      if (h > 23 || min > 59) return null;
      return `${pad2(h)}:${pad2(min)}`;
    }
  }
  return null;
};

const findExcelHeaderRow = (rows) => {
  for (let i = 0; i < Math.min(6, rows.length); i++) {
    const cells = (rows[i] || []).map(c => normalizeStr(c));
    if (cells.some(c => c.includes("subject")) && cells.some(c => c === "class" || c.includes("class"))) return i;
  }
  return -1;
};

const mapExcelColumns = (headerRow) => {
  const cells = headerRow.map(c => normalizeStr(c));
  const findIdx = (test) => cells.findIndex(test);
  const cols = {
    subject: findIdx(c => c.includes("subject")),
    className: findIdx(c => c === "class" || c.includes("class")),
    date: findIdx(c => c === "date" || c.includes("date")),
    startTime: findIdx(c => c.includes("start")),
    endTime: findIdx(c => c.includes("end")),
    venue: findIdx(c => c.includes("venue")),
    invigilatorCols: [],
  };
  cells.forEach((c, idx) => { if (c.includes("invigilator")) cols.invigilatorCols.push(idx); });
  return cols;
};

/* Reads a File (xlsx/xls/csv) and returns { rows, headerRowIndex, cols, error } — no exam records are created here. */
const readExcelFile = (file) => new Promise((resolve) => {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: "array", cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "" });
      const nonEmpty = rows.filter(r => r.some(c => String(c).trim() !== ""));
      if (nonEmpty.length === 0) { resolve({ error: "This spreadsheet appears to be empty." }); return; }
      const headerRowIndex = findExcelHeaderRow(nonEmpty);
      if (headerRowIndex === -1) { resolve({ error: "We couldn't find the expected column headers (Subject, Class, Date, Start Time, End Time, Venue). Please use the EduSync Excel template." }); return; }
      const cols = mapExcelColumns(nonEmpty[headerRowIndex]);
      if (cols.subject === -1 || cols.className === -1 || cols.date === -1 || cols.startTime === -1 || cols.endTime === -1 || cols.venue === -1) {
        resolve({ error: "This file is missing one or more required columns (Subject, Class, Date, Start Time, End Time, Venue)." }); return;
      }
      const dataRows = nonEmpty.slice(headerRowIndex + 1);
      if (dataRows.length === 0) { resolve({ error: "This spreadsheet has headers but no examination rows." }); return; }
      resolve({ rows: dataRows, cols });
    } catch (err) {
      resolve({ error: "We couldn't read this file. Please upload a valid .xlsx, .xls, or .csv file." });
    }
  };
  reader.onerror = () => resolve({ error: "We couldn't read this file. Please try again." });
  reader.readAsArrayBuffer(file);
});

/* Core analysis service shared by Import and Sync — never writes to app state directly. */
const analyzeExcelRows = (dataRows, cols, staffList, examsList, mode) => {
  const existingKeys = new Set(examsList.map(e => e.externalKey));
  const existingByIdentity = new Map(examsList.filter(e => e.status !== "Cancelled").map(e => [buildIdentityKey(e.subject, e.className), e]));
  const seenKeysInFile = new Set();
  const batchCandidates = [];
  const results = [];

  dataRows.forEach((row, i) => {
    const get = (idx) => idx >= 0 ? row[idx] : "";
    const subjectRaw = String(get(cols.subject) || "").trim();
    const classRaw = String(get(cols.className) || "").trim();
    const dateRaw = get(cols.date);
    const startRaw = get(cols.startTime);
    const endRaw = get(cols.endTime);
    const venueRaw = String(get(cols.venue) || "").trim();
    const invigilatorNamesRaw = cols.invigilatorCols.map(idx => String(get(idx) || "").trim()).filter(Boolean);

    const parsedDate = dateRaw ? parseExcelDateCell(dateRaw) : null;
    const parsedStart = startRaw !== "" ? parseExcelTimeCell(startRaw) : null;
    const parsedEnd = endRaw !== "" ? parseExcelTimeCell(endRaw) : null;

    const issues = [];
    if (!subjectRaw) issues.push("Missing subject.");
    if (!classRaw) issues.push("Missing class.");
    if (!dateRaw && dateRaw !== 0) issues.push("Missing date.");
    else if (!parsedDate) issues.push("Invalid date.");
    if (startRaw === "") issues.push("Missing start time.");
    else if (!parsedStart) issues.push("Invalid start time.");
    if (endRaw === "") issues.push("Missing end time.");
    else if (!parsedEnd) issues.push("Invalid end time.");
    if (parsedStart && parsedEnd && timeToMinutes(parsedEnd) <= timeToMinutes(parsedStart)) issues.push("End time must be later than start time.");
    if (!venueRaw) issues.push("Missing venue.");

    let invigilatorIds = [];
    if (invigilatorNamesRaw.length === 0) {
      issues.push("At least one invigilator is required.");
    } else {
      invigilatorNamesRaw.forEach(name => {
        const staff = staffList.find(s => normalizeStr(s.fullName) === normalizeStr(name));
        if (!staff) issues.push(`Invigilator not found: ${name}`);
        else if (staff.status === "Deactivated") issues.push(`Invigilator is deactivated: ${name}`);
        else invigilatorIds.push(staff.id);
      });
      if (invigilatorIds.length === 0) issues.push("No valid invigilator found for this row.");
    }

    const hasError = !subjectRaw || !classRaw || !parsedDate || !parsedStart || !parsedEnd || !venueRaw ||
      (parsedStart && parsedEnd && timeToMinutes(parsedEnd) <= timeToMinutes(parsedStart)) || invigilatorIds.length === 0;
    const hasInvigilatorWarning = invigilatorIds.length > 0 && invigilatorIds.length < invigilatorNamesRaw.length;

    const base = {
      rowNumber: i + 1, subject: subjectRaw, className: classRaw, date: parsedDate, startTime: parsedStart, endTime: parsedEnd,
      venue: venueRaw, invigilatorIds, notes: "", issues, matchExam: null, diff: [],
    };

    if (hasError) { results.push({ ...base, status: "error" }); return; }

    const key = buildExternalKey(subjectRaw, classRaw, parsedDate, parsedStart, venueRaw);
    const identityKey = buildIdentityKey(subjectRaw, classRaw);

    if (mode === "import") {
      if (seenKeysInFile.has(key)) { results.push({ ...base, status: "duplicate", issues: [...issues, "Duplicate row within this file."] }); return; }
      seenKeysInFile.add(key);
      if (existingKeys.has(key)) { results.push({ ...base, status: "duplicate", issues: [...issues, "Already exists in EduSync."] }); return; }
      const candidate = { id: `batch-${i}`, date: parsedDate, startTime: parsedStart, endTime: parsedEnd, invigilatorIds };
      batchCandidates.push(candidate);
      const result = { ...base, status: hasInvigilatorWarning ? "warning" : "ready", _candidate: candidate };
      results.push(result);
    } else {
      // sync mode
      const matchExam = existingByIdentity.get(identityKey) || null;
      let diff = [];
      if (matchExam) {
        if (matchExam.date !== parsedDate || matchExam.startTime !== parsedStart || matchExam.endTime !== parsedEnd) {
          diff.push({ field: "Date/Time", from: `${formatDateDisplay(matchExam.date)}, ${formatTimeRange(matchExam.startTime, matchExam.endTime)}`, to: `${formatDateDisplay(parsedDate)}, ${formatTimeRange(parsedStart, parsedEnd)}`, kind: "schedule" });
        }
        if (normalizeStr(matchExam.venue) !== normalizeStr(venueRaw)) {
          diff.push({ field: "Venue", from: matchExam.venue, to: venueRaw, kind: "venue" });
        }
        const oldNames = matchExam.invigilatorIds.map(id => { const s = staffList.find(x => x.id === id); return s ? s.fullName : "Unknown"; }).sort().join(", ");
        const newNames = invigilatorIds.map(id => { const s = staffList.find(x => x.id === id); return s ? s.fullName : "Unknown"; }).sort().join(", ");
        if (oldNames !== newNames) diff.push({ field: "Invigilators", from: oldNames || "None", to: newNames || "None", kind: "invigilator" });
      }
      const candidate = { id: matchExam ? matchExam.id : `batch-${i}`, date: parsedDate, startTime: parsedStart, endTime: parsedEnd, invigilatorIds };
      batchCandidates.push(candidate);
      const status = !matchExam ? "new" : (diff.length ? "changed" : "unchanged");
      results.push({ ...base, status, matchExam, diff, _candidate: candidate });
    }
  });

  // Second pass: conflict detection against existing schedule + the rest of this batch.
  const scheduledExisting = examsList.filter(e => e.status === "Scheduled");
  results.forEach(r => {
    if (!r._candidate || r.status === "error" || r.status === "duplicate" || r.status === "unchanged") return;
    const others = batchCandidates.filter(c => c.id !== r._candidate.id);
    const conflicts = getConflicts([...scheduledExisting, ...others], r._candidate, staffList);
    if (conflicts.length) {
      r.status = "conflict";
      r.issues = [...r.issues, ...conflicts.map(c => `${c.staffName} conflicts with ${c.subject} (${c.className}) on ${formatDateDisplay(c.date)} at ${formatTimeRange(c.startTime, c.endTime)}.`)];
    }
  });

  results.forEach(r => delete r._candidate);

  let removed = [];
  if (mode === "sync") {
    const uploadedIdentities = new Set(results.filter(r => r.status !== "error").map(r => buildIdentityKey(r.subject, r.className)));
    removed = examsList.filter(e => e.status === "Scheduled" && !uploadedIdentities.has(buildIdentityKey(e.subject, e.className)))
      .map(e => ({ exam: e, decision: "keep" }));
  }

  return { rows: results, removed };
};

/* ============================= LOCAL PERSISTENCE SERVICE ============================= */
/* Local-only persistence (browser localStorage). No cloud, no network, no cross-device sync —
   each browser keeps its own copy. Namespaced + versioned so a future schema change can migrate
   or safely reinitialize instead of crashing on old data. */
const STORAGE_VERSION = 1;
const STORAGE_PREFIX = `edusync_v${STORAGE_VERSION}_`;

const checkStorageAvailable = () => {
  try {
    const testKey = "__edusync_storage_test__";
    window.localStorage.setItem(testKey, "1");
    window.localStorage.removeItem(testKey);
    return true;
  } catch (e) { return false; }
};

const storageGet = (key) => {
  try {
    const raw = window.localStorage.getItem(STORAGE_PREFIX + key);
    return raw === null ? null : JSON.parse(raw);
  } catch (e) { return null; }
};
const storageSet = (key, value) => {
  try { window.localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value)); return true; }
  catch (e) { return false; }
};
const storageRemove = (key) => { try { window.localStorage.removeItem(STORAGE_PREFIX + key); } catch (e) {} };

/* Domain-specific save/load pairs — the only functions the rest of the app talks to. */
const saveStaff = (list) => storageSet("staff", list);
const loadStaff = () => storageGet("staff");

const saveExaminations = (list) => storageSet("exams", list);
const loadExaminations = () => storageGet("exams");

/* Reminders carry a Date (scheduledAt) — JSON round-trips it as an ISO string, so it must be revived on load. */
const saveReminders = (list) => storageSet("reminders", list);
const loadReminders = () => {
  const raw = storageGet("reminders");
  return raw ? raw.map(r => ({ ...r, scheduledAt: new Date(r.scheduledAt) })) : null;
};

const saveNotifications = (list) => storageSet("notifications", list);
const loadNotifications = () => storageGet("notifications");

const saveSubmissions = (list) => storageSet("submissions", list);
const loadSubmissions = () => storageGet("submissions");

/* Activity entries store an iconKey (string), never a component reference, so this is plain JSON — see ICON_REGISTRY. */
const saveActivities = (list) => storageSet("activity", list.slice(0, 300));
const loadActivities = () => storageGet("activity");

const saveSettings = (settings) => storageSet("settings", settings);
const loadSettings = () => storageGet("settings");

const saveMeta = (meta) => storageSet("meta", meta);
const loadMeta = () => storageGet("meta");

const clearAllEduSyncStorage = () => {
  ["staff", "exams", "submissions", "reminders", "notifications", "activity", "settings", "meta"].forEach(storageRemove);
};

const SUBMISSION_STATUSES = ["Upcoming", "Completed", "Cancelled"];

/* "Reminder Active" is a real, reminder-engine-derived state (not a proximity guess): a submission is
   Reminder Active once one of its own reminders has fired (Sent) or is currently Due. Completed and
   Cancelled are real stored statuses set by the admin and are returned as-is. */
const getSubmissionDisplayStatus = (submission, reminders, demoClock) => {
  if (submission.status !== "Upcoming") return submission.status;
  const subReminders = reminders.filter(r => r.kind === "submission" && r.submissionId === submission.id);
  const active = subReminders.some(r => r.status === "Sent" || getReminderDisplayStatus(r, demoClock) === "Due");
  return active ? "Reminder Active" : "Upcoming";
};

const searchSubmissions = (list, query) => {
  const q = query.trim().toLowerCase();
  if (!q) return list;
  return list.filter(s => s.subject.toLowerCase().includes(q) || s.class.toLowerCase().includes(q) || s.teacherName.toLowerCase().includes(q));
};

const filterSubmissions = (list, status) => status === "All" ? list : list.filter(s => s.status === status);

const validateSubmissionForm = ({ subject, className, teacherId, deadlineDate, deadlineTime }) => {
  const errors = {};
  if (!subject || !subject.trim()) errors.subject = "Please enter the examination subject.";
  if (!className || !className.trim()) errors.className = "Please enter the class.";
  if (!teacherId) errors.teacherId = "Please select the responsible teacher.";
  if (!deadlineDate) errors.deadlineDate = "Please select a deadline date.";
  if (!deadlineTime) errors.deadlineTime = "Please select a deadline time.";
  return errors;
};

/* Submission reminders reuse the exact same offsets, engine, and Demo Clock comparison as invigilation
   reminders — only the recipient (the responsible teacher only) and message text differ. */
const SUBMISSION_REMINDER_LABELS = { "24h": "24-Hour Submission Reminder", "1h": "1-Hour Submission Reminder", "15m": "15-Minute Submission Reminder" };

const buildSubmissionReminders = (submission) => {
  const deadline = parseExamDateTime(submission.deadlineDate, submission.deadlineTime);
  const version = submission.scheduleVersion || 1;
  const nowIso = new Date().toISOString();
  return REMINDER_OFFSETS.map(off => ({
    id: `sub-${submission.id}-${off.type}-v${version}`,
    kind: "submission", submissionId: submission.id, examId: null, invigilatorId: submission.teacherId,
    type: off.type, label: SUBMISSION_REMINDER_LABELS[off.type],
    scheduledAt: new Date(deadline.getTime() - off.ms),
    status: "Pending", channel: "Demo WhatsApp", scheduleVersion: version, createdAt: nowIso, sentAt: null,
  }));
};

const buildSubmissionReminderMessage = (type, submission) => {
  const time = formatTime12(submission.deadlineTime);
  if (type === "24h") return `EduSync Reminder: ${submission.subject} ${submission.class} question submission deadline is tomorrow at ${time}.`;
  if (type === "1h") return `EduSync Reminder: ${submission.subject} ${submission.class} question submission deadline is in 1 hour.`;
  return `EduSync Reminder: ${submission.subject} ${submission.class} question submission deadline is in 15 minutes.`;
};

/* ============================= APP BOOTSTRAP: LOAD PERSISTED DATA OR SEED DEMO DATA ============================= */
/* Runs once per session (via a lazy useState initializer in App). Demo data is only ever written the very
   first time EduSync runs in a browser — after that, persisted data is always the source of truth. */
const bootstrapEduSyncData = () => {
  const storageOk = checkStorageAvailable();
  const meta = storageOk ? loadMeta() : null;
  const freshInit = !storageOk || !meta || meta.version !== STORAGE_VERSION || !meta.initialized;

  if (freshInit) {
    const staff = staffSeed;
    const exams = examSeed;
    const submissions = submissionSeed;
    const reminders = [
      ...examSeed.filter(e => e.status === "Scheduled").flatMap(buildReminders),
      ...submissionSeed.filter(s => s.status === "Upcoming").flatMap(buildSubmissionReminders),
    ];
    const notifications = notificationsSeed;
    const activity = [];
    const demoClock = INITIAL_DEMO_CLOCK;
    if (storageOk) {
      saveStaff(staff); saveExaminations(exams); saveSubmissions(submissions); saveReminders(reminders);
      saveNotifications(notifications); saveActivities(activity);
      saveSettings({ demoClock: demoClock.toISOString() });
      saveMeta({ version: STORAGE_VERSION, initialized: true });
    }
    return { staff, exams, submissions, reminders, notifications, activity, demoClock, storageOk };
  }

  const settings = loadSettings();
  return {
    staff: loadStaff() || staffSeed,
    exams: loadExaminations() || examSeed,
    submissions: loadSubmissions() || [], // [] not submissionSeed — never re-seed demo data over an existing real dataset
    reminders: loadReminders() || [],
    notifications: loadNotifications() || notificationsSeed,
    activity: loadActivities() || [],
    demoClock: settings && settings.demoClock ? new Date(settings.demoClock) : INITIAL_DEMO_CLOCK,
    storageOk: true,
  };
};

const resetEduSyncToDemoData = () => {
  clearAllEduSyncStorage();
  const staff = staffSeed;
  const exams = examSeed;
  const submissions = submissionSeed;
  const reminders = [
    ...examSeed.filter(e => e.status === "Scheduled").flatMap(buildReminders),
    ...submissionSeed.filter(s => s.status === "Upcoming").flatMap(buildSubmissionReminders),
  ];
  const notifications = notificationsSeed;
  const activity = [];
  const demoClock = INITIAL_DEMO_CLOCK;
  saveStaff(staff); saveExaminations(exams); saveSubmissions(submissions); saveReminders(reminders);
  saveNotifications(notifications); saveActivities(activity);
  saveSettings({ demoClock: demoClock.toISOString() });
  saveMeta({ version: STORAGE_VERSION, initialized: true });
  return { staff, exams, submissions, reminders, notifications, activity, demoClock };
};

const ExaminationFormModal = ({ open, mode, initialData, examsList, staffList, onClose, onSubmit }) => {

  const [className, setClassName] = useState("");
  const [date, setDate] = useState("");
  const [startTime, setStartTime] = useState("");
  const [endTime, setEndTime] = useState("");
  const [venue, setVenue] = useState("");
  const [notes, setNotes] = useState("");
  const [invigilatorIds, setInvigilatorIds] = useState([]);
  const [errors, setErrors] = useState({});

  useEffect(() => {
    if (!open) return;
    if (initialData) {
      setSubject(initialData.subject); setClassName(initialData.className); setDate(initialData.date);
      setStartTime(initialData.startTime); setEndTime(initialData.endTime); setVenue(initialData.venue);
      setNotes(initialData.notes || ""); setInvigilatorIds(initialData.invigilatorIds);
    } else {
      setSubject(""); setClassName(""); setDate(TODAY_ISO); setStartTime(""); setEndTime(""); setVenue(""); setNotes(""); setInvigilatorIds([]);
    }
    setErrors({});
  }, [open, initialData]);

  if (!open) return null;

  const candidate = { id: initialData ? initialData.id : "new", date, startTime, endTime, invigilatorIds };
  const conflicts = (date && startTime && endTime && invigilatorIds.length) ? getConflicts(examsList, candidate, staffList) : [];
  const activeStaff = staffList.filter(s => s.status === "Active");
  const historicalDeactivated = initialData
    ? initialData.invigilatorIds.map(id => staffList.find(s => s.id === id)).filter(s => s && s.status === "Deactivated")

  const toggleInvigilator = (id) => setInvigilatorIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);

  const handleSubmit = (e) => {
    e.preventDefault();
    const errs = validateExamForm({ subject, className, date, startTime, endTime, venue, invigilatorIds });
    if (Object.keys(errs).length) { setErrors(errs); return; }
    if (conflicts.length) { setErrors({ conflict: "Resolve the invigilator conflict below before saving." }); return; }

        <div className="flex items-start justify-between">
          <div>
            <h3 className="text-lg font-bold text-slate-900">{mode === "edit" ? "Edit Examination" : "Add Examination"}</h3>
            <p className="text-sm text-slate-500 mt-0.5">{mode === "edit" ? "Update this examination's details." : "Schedule a new examination."}</p>
          </div>
          <button type="button" onClick={onClose} className="focus-ring text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg p-1.5 transition-colors duration-150" aria-label="Close">
            <IconX size={18} />
          </button>
        </div>

        <div className="space-y-4 mt-5">
          <div className="grid grid-cols-2 gap-3">
            <FormField label="Subject" error={errors.subject}>
              <input className={inputClass} value={subject} onChange={(e) => setSubject(e.target.value)} placeholder="e.g. Biology" />
            </FormField>
            <FormField label="Class" error={errors.className}>
              <input className={inputClass} value={className} onChange={(e) => setClassName(e.target.value)} placeholder="e.g. SS2" />
            </FormField>
          </div>

          <FormField label="Examination Date" error={errors.date}>
            <input type="date" className={inputClass} value={date} onChange={(e) => setDate(e.target.value)} />
          </FormField>

          <div className="grid grid-cols-2 gap-3">
            <FormField label="Start Time" error={errors.startTime}>
              <input type="time" className={inputClass} value={startTime} onChange={(e) => setStartTime(e.target.value)} />
            </FormField>
            <FormField label="End Time" error={errors.endTime}>
              <input type="time" className={inputClass} value={endTime} onChange={(e) => setEndTime(e.target.value)} />
            </FormField>
          </div>

          <FormField label="Venue" error={errors.venue}>
            <input className={inputClass} value={venue} onChange={(e) => setVenue(e.target.value)} placeholder="e.g. Hall A" />
          </FormField>

          <FormField label="Invigilators" error={errors.invigilators}>
            <div className="border border-slate-200 rounded-xl p-3 space-y-1.5 max-h-40 overflow-y-auto">
              {activeStaff.map(s => (
                <label key={s.id} className="flex items-center gap-2.5 text-sm px-1 py-1.5 rounded-lg hover:bg-slate-50 cursor-pointer">
                  <input type="checkbox" checked={invigilatorIds.includes(s.id)} onChange={() => toggleInvigilator(s.id)}
                    className="w-4 h-4 rounded border-slate-300 text-brand-blue focus:ring-brand-blue" />
                  <span className="text-slate-700 font-medium">{s.fullName}</span>
                  <span className="text-xs text-slate-400">{s.role}</span>
                </label>
              ))}
            </div>
            {historicalDeactivated.length > 0 && (
              <div className="mt-2 flex flex-wrap gap-1.5">
                {historicalDeactivated.map(s => (
                  <span key={s.id} className="inline-flex items-center gap-1 bg-slate-100 text-slate-500 text-xs font-medium px-2 py-1 rounded-full">
                    {s.fullName} · Deactivated (historical)
                  </span>
                ))}
              </div>
            )}
          </FormField>

          {conflicts.length > 0 && (
            <div className="bg-brand-danger/5 border border-brand-danger/20 rounded-xl p-3.5 space-y-2">
              <div className="flex items-center gap-2 text-sm font-semibold text-brand-danger"><IconAlertTriangle size={15}/>Invigilator conflict detected</div>
              {conflicts.map((c, i) => (
                <p key={i} className="text-xs text-slate-600 leading-relaxed">
                  <span className="font-semibold text-slate-800">{c.staffName}</span> is already assigned to {c.subject} ({c.className}) on {formatDateDisplay(c.date)} from {formatTimeRange(c.startTime, c.endTime)}.
                </p>
              ))}
            </div>
          )}
          {errors.conflict && <p className="text-xs text-brand-danger flex items-center gap-1"><IconAlertTriangle size={12}/>{errors.conflict}</p>}

          <FormField label="Notes (optional)">
            <textarea className={inputClass} rows={2} value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Any special instructions..." />
          </FormField>
        </div>

        <div className="flex gap-3 mt-6">
          <Button variant="secondary" type="button" className="flex-1" onClick={onClose}>Cancel</Button>
          <Button variant="primary" type="submit" className="flex-1" disabled={conflicts.length > 0}>{mode === "edit" ? "Save Changes" : "Add Examination"}</Button>
        </div>
      </form>
    </div>
  );

  const [venue, setVenue] = useState("");

  useEffect(() => {
    if (open && exam) {
      setDate(exam.date); setStartTime(exam.startTime); setEndTime(exam.endTime); setVenue(exam.venue);
      setErrors({});

  if (!open || !exam) return null;

          <IconInfo size={14} className="text-brand-warning flex-shrink-0 mt-0.5" />

          {conflicts.length > 0 && (

                <p key={i} className="text-xs text-slate-600 leading-relaxed">
