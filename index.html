/* ============================= EXCEL IMPORT / SYNC WORKFLOW MODAL ============================= */
const ROW_STATUS_STYLE = {
  ready:     { color: "success", icon: IconCheckCircle, label: "Ready to Import" },
  warning:   { color: "warning", icon: IconAlertTriangle, label: "Needs Attention" },
  error:     { color: "danger",  icon: IconXCircle,      label: "Error" },
  duplicate: { color: "slate",   icon: IconXCircle,      label: "Already Exists" },
  conflict:  { color: "danger",  icon: IconAlertTriangle, label: "Conflict" },
  new:       { color: "info",    icon: IconPlus,          label: "New" },
  changed:   { color: "warning", icon: IconSync,          label: "Changed" },
  unchanged: { color: "slate",   icon: IconCheckCircle,   label: "Unchanged" },
};

const RowStatusBadge = ({ status }) => {
  const cfg = ROW_STATUS_STYLE[status] || ROW_STATUS_STYLE.ready;
  const c = colorMap[cfg.color];
  const IconComp = cfg.icon;
  return (
    <span className={`inline-flex items-center gap-1.5 ${c.bg} ${c.text} text-xs font-semibold px-2.5 py-1 rounded-full whitespace-nowrap flex-shrink-0`}>
      <IconComp size={13} />{cfg.label}
    </span>
  );
};

const ExcelWorkflowModal = ({ open, mode, examsList, staffList, onClose, onConfirmImport, onConfirmSync }) => {
  const [step, setStep] = useState("upload");
  const [fileName, setFileName] = useState("");
  const [fileError, setFileError] = useState("");
  const [rows, setRows] = useState([]);
  const [removed, setRemoved] = useState([]);
  const [selected, setSelected] = useState({});
  const [isReading, setIsReading] = useState(false);

  useEffect(() => {
    if (open) { setStep("upload"); setFileName(""); setFileError(""); setRows([]); setRemoved([]); setSelected({}); setIsReading(false); }
  }, [open, mode]);

  if (!open) return null;

  const title = mode === "sync" ? "Sync Excel Timetable" : "Import Excel Timetable";

  const handleFileChange = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setFileName(file.name);
    setFileError("");
    setIsReading(true);
    const { rows: dataRows, cols, error } = await readExcelFile(file);
    setIsReading(false);
    if (error) { setFileError(error); return; }
    const analysis = analyzeExcelRows(dataRows, cols, staffList, examsList, mode);
    setRows(analysis.rows);
    const initialSelected = {};
    analysis.rows.forEach((r, i) => { if (["ready", "warning", "new", "changed"].includes(r.status)) initialSelected[i] = true; });
    setSelected(initialSelected);
    setRemoved(analysis.removed);
    setStep("preview");
  };

  const toggleSelected = (i) => setSelected(prev => ({ ...prev, [i]: !prev[i] }));
  const setRemovedDecision = (idx, decision) => setRemoved(prev => prev.map((r, i) => i === idx ? { ...r, decision } : r));

  const importableCount = rows.filter(r => ["ready", "warning"].includes(r.status)).length;
  const summary = mode === "import"
    ? {
        "Total Rows": rows.length,
        "Ready": rows.filter(r => r.status === "ready").length,
        "Warnings": rows.filter(r => r.status === "warning").length,
        "Errors": rows.filter(r => r.status === "error").length,
        "Conflicts": rows.filter(r => r.status === "conflict").length,
        "Already Exists": rows.filter(r => r.status === "duplicate").length,
      }
    : {
        "New": rows.filter(r => r.status === "new").length,
        "Changed": rows.filter(r => r.status === "changed").length,
        "Invigilator Changes": rows.filter(r => r.diff.some(d => d.kind === "invigilator")).length,
        "Venue Changes": rows.filter(r => r.diff.some(d => d.kind === "venue")).length,
        "Unchanged": rows.filter(r => r.status === "unchanged").length,
        "Removed From Sheet": removed.length,
        "Conflicts": rows.filter(r => r.status === "conflict").length,
        "Errors": rows.filter(r => r.status === "error").length,
      };

  const handleConfirm = () => {
    if (mode === "import") {
      const toImport = rows.filter((r, i) => selected[i] && ["ready", "warning"].includes(r.status));
      onConfirmImport(toImport);
    } else {
      const toApply = rows.filter((r, i) => selected[i] && ["new", "changed"].includes(r.status));
      onConfirmSync(toApply, removed);
    }
  };

  const applyAll = () => {
    const next = {};
    rows.forEach((r, i) => { if (["ready", "warning", "new", "changed"].includes(r.status)) next[i] = true; });
    setSelected(next);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 anim-fade" style={{ background: "rgba(15,23,42,0.45)" }} onClick={onClose}>
      <div className="bg-white rounded-2xl shadow-xl max-w-2xl w-full max-h-[92vh] overflow-y-auto p-6 anim-slide" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-start justify-between">
          <div>
            <h3 className="text-lg font-bold text-slate-900">{title}</h3>
            <p className="text-sm text-slate-500 mt-0.5">
              {step === "upload" ? "Upload a spreadsheet to review before anything is added." : "Review the results below, then confirm what to apply."}
            </p>
          </div>
          <button onClick={onClose} className="focus-ring text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg p-1.5 transition-colors duration-150 flex-shrink-0" aria-label="Close">
            <IconX size={18} />
          </button>
        </div>

        {step === "upload" && (
          <div className="mt-6">
            <label className="flex flex-col items-center justify-center gap-3 border-2 border-dashed border-slate-200 rounded-2xl py-12 px-6 text-center cursor-pointer hover:border-brand-blue/40 hover:bg-slate-50 transition-colors duration-150">
              <IconContainer icon={IconSheet} color={mode === "sync" ? "teal" : "blue"} size="lg" />
              <div className="text-sm font-semibold text-slate-700">{isReading ? "Reading file..." : "Click to choose a spreadsheet"}</div>
              <div className="text-xs text-slate-400">.xlsx, .xls, or .csv — using the EduSync timetable format</div>
              <input type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={handleFileChange} disabled={isReading} />
            </label>
            {fileName && !fileError && <p className="text-xs text-slate-400 mt-2">Selected: {fileName}</p>}
            {fileError && (
              <div className="mt-4 flex items-start gap-2 bg-brand-danger/5 border border-brand-danger/20 rounded-xl px-3.5 py-3 text-sm text-brand-danger">
                <IconAlertTriangle size={15} className="flex-shrink-0 mt-0.5" />{fileError}
              </div>
            )}
            <div className="mt-5 flex items-start gap-2 bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-3 text-xs text-slate-500 leading-relaxed">
              <IconInfo size={14} className="text-slate-400 flex-shrink-0 mt-0.5" />
              Nothing is added to EduSync yet — you'll see a full preview before anything is imported or changed. Don't have a file yet?
              {" "}<button type="button" onClick={downloadExcelTemplate} className="text-brand-blue font-semibold underline underline-offset-2">Download the template</button>.
            </div>
            <Button variant="secondary" className="w-full mt-5" onClick={onClose}>Cancel</Button>
          </div>
        )}

        {step === "preview" && (
          <div className="mt-6 space-y-5">
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
              {Object.entries(summary).map(([label, value]) => (
                <div key={label} className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5">
                  <div className="text-lg font-extrabold text-slate-900">{value}</div>
                  <div className="text-[11px] text-slate-500 leading-tight">{label}</div>
                </div>
              ))}
            </div>

            {mode === "sync" && removed.length > 0 && (
              <div>
                <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wide mb-2">Missing From Latest Excel Timetable</h4>
                <div className="space-y-2">
                  {removed.map((r, i) => (
                    <div key={r.exam.id} className="border border-slate-100 rounded-xl p-3">
                      <div className="flex items-center justify-between gap-2 flex-wrap">
                        <div className="text-sm font-semibold text-slate-800">{r.exam.subject} · {r.exam.className}</div>
                        <span className="text-xs text-slate-400">{formatDateDisplay(r.exam.date)}, {formatTimeRange(r.exam.startTime, r.exam.endTime)}</span>
                      </div>
                      <div className="flex items-center gap-3 mt-2 text-xs">
                        <label className="flex items-center gap-1.5 cursor-pointer">
                          <input type="radio" name={`removed-${i}`} checked={r.decision === "keep"} onChange={() => setRemovedDecision(i, "keep")} className="text-brand-blue focus:ring-brand-blue" />
                          Keep examination
                        </label>
                        <label className="flex items-center gap-1.5 cursor-pointer">
                          <input type="radio" name={`removed-${i}`} checked={r.decision === "cancel"} onChange={() => setRemovedDecision(i, "cancel")} className="text-brand-danger focus:ring-brand-danger" />
                          Mark as Cancelled
                        </label>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <div>
              <div className="flex items-center justify-between mb-2">
                <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wide">Row-by-Row Results</h4>
                <button onClick={applyAll} className="text-xs font-semibold text-brand-blue hover:underline">Select all eligible</button>
              </div>
              <div className="space-y-2 max-h-80 overflow-y-auto pr-1">
                {rows.map((r, i) => {
                  const canSelect = mode === "import" ? ["ready", "warning"].includes(r.status) : ["new", "changed"].includes(r.status);
                  return (
                    <div key={i} className="border border-slate-100 rounded-xl p-3">
                      <div className="flex items-start justify-between gap-2 flex-wrap">
                        <div className="flex items-start gap-2.5 min-w-0">
                          {canSelect && (
                            <input type="checkbox" checked={!!selected[i]} onChange={() => toggleSelected(i)}
                              className="mt-1 w-4 h-4 rounded border-slate-300 text-brand-blue focus:ring-brand-blue flex-shrink-0" />
                          )}
                          <div className="min-w-0">
                            <div className="text-sm font-semibold text-slate-800 truncate">{r.subject || "(missing subject)"} <span className="text-slate-400 font-normal">{r.className ? `· ${r.className}` : ""}</span></div>
                            <div className="text-xs text-slate-400 mt-0.5">
                              {r.date ? formatDateDisplay(r.date) : "—"}{r.startTime && r.endTime ? `, ${formatTimeRange(r.startTime, r.endTime)}` : ""}{r.venue ? ` · ${r.venue}` : ""}
                            </div>
                          </div>
                        </div>
                        <RowStatusBadge status={r.status} />
                      </div>
                      {r.diff.length > 0 && (
                        <div className="mt-2 pl-6 space-y-1">
                          {r.diff.map((d, di) => (
                            <p key={di} className="text-xs text-slate-600">
                              <span className="font-semibold">{d.field} changed:</span> {d.from} <IconArrowRight size={10} className="inline mx-0.5 text-slate-400" /> {d.to}
                            </p>
                          ))}
                        </div>
                      )}
                      {r.issues.length > 0 && (
                        <div className="mt-2 pl-6 space-y-0.5">
                          {r.issues.map((msg, mi) => (
                            <p key={mi} className="text-xs text-slate-500">• {msg}</p>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="flex gap-3 pt-2">
              <Button variant="secondary" className="flex-1" onClick={onClose}>Cancel {mode === "sync" ? "Sync" : ""}</Button>
              <Button variant="primary" className="flex-1" onClick={handleConfirm}
                disabled={mode === "import" ? importableCount === 0 : rows.every(r => !["new", "changed"].includes(r.status)) && removed.every(r => r.decision === "keep")}>
                {mode === "sync" ? "Apply Selected Changes" : "Import Valid Rows"}
              </Button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

const SubmissionFormModal = ({ open, mode, initialData, staffList, onClose, onSubmit }) => {
  const [subject, setSubject] = useState("");
  const [className, setClassName] = useState("");
  const [teacherQuery, setTeacherQuery] = useState("");
  const [teacherId, setTeacherId] = useState(null);
  const [deadlineDate, setDeadlineDate] = useState("");
  const [deadlineTime, setDeadlineTime] = useState("");
  const [notes, setNotes] = useState("");
  const [errors, setErrors] = useState({});

  useEffect(() => {
    if (!open) return;
    if (initialData) {
      setSubject(initialData.subject); setClassName(initialData.class);
      setTeacherId(initialData.teacherId); setTeacherQuery(initialData.teacherName);
      setDeadlineDate(initialData.deadlineDate); setDeadlineTime(initialData.deadlineTime);
      setNotes(initialData.notes || "");
    } else {
      setSubject(""); setClassName(""); setTeacherId(null); setTeacherQuery("");
      setDeadlineDate(TODAY_ISO); setDeadlineTime(""); setNotes("");
    }
    setErrors({});
  }, [open, initialData]);

  if (!open) return null;

  const activeStaff = getActiveStaff(staffList);
  const teacherMatches = teacherQuery.trim() && (!teacherId || staffList.find(s => s.id === teacherId)?.fullName !== teacherQuery)
    ? activeStaff.filter(s => normalizeStr(s.fullName).includes(normalizeStr(teacherQuery)))
    : [];

  const selectTeacher = (staff) => { setTeacherId(staff.id); setTeacherQuery(staff.fullName); };

  const handleSubmit = (e) => {
    e.preventDefault();
    const errs = validateSubmissionForm({ subject, className, teacherId, deadlineDate, deadlineTime });
    if (Object.keys(errs).length) { setErrors(errs); return; }
    const teacher = staffList.find(s => s.id === teacherId);
    onSubmit({ subject: subject.trim(), class: className.trim(), teacherId, teacherName: teacher.fullName, deadlineDate, deadlineTime, notes: notes.trim() });
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 anim-fade" style={{ background: "rgba(15,23,42,0.45)" }} onClick={onClose}>

        <div className="flex items-start justify-between">
          <div>
            <h3 className="text-lg font-bold text-slate-900">{mode === "edit" ? "Edit Question Submission" : "Add Question Submission"}</h3>
            <p className="text-sm text-slate-500 mt-0.5">{mode === "edit" ? "Update this submission's details." : "Record a question submission for a teacher to track."}</p>
          </div>
          <button type="button" onClick={onClose} className="focus-ring text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg p-1.5 transition-colors duration-150" aria-label="Close">
            <IconX size={18} />
          </button>
        </div>

        <div className="space-y-4 mt-5">
          <div className="grid grid-cols-2 gap-3">
            <FormField label="Subject" error={errors.subject}>
              <input className={inputClass} value={subject} onChange={(e) => setSubject(e.target.value)} placeholder="e.g. Biology" />
            </FormField>
            <FormField label="Class" error={errors.className}>
              <input className={inputClass} value={className} onChange={(e) => setClassName(e.target.value)} placeholder="e.g. SS2" />
            </FormField>
          </div>

          <FormField label="Teacher" error={errors.teacherId}>
            <div className="relative">
              <input className={inputClass} value={teacherQuery}
                onChange={(e) => { setTeacherQuery(e.target.value); setTeacherId(null); }}
                placeholder="Search active staff..." />
              {teacherMatches.length > 0 && (
                <div className="absolute z-10 mt-1 w-full bg-white border border-slate-200 rounded-xl shadow-lg max-h-40 overflow-y-auto">
                  {teacherMatches.map(s => (
                    <button type="button" key={s.id} onClick={() => selectTeacher(s)}
                      className="w-full text-left px-3.5 py-2 text-sm hover:bg-slate-50 flex items-center justify-between">
                      <span className="text-slate-700 font-medium">{s.fullName}</span>
                      <span className="text-xs text-slate-400">{s.role}</span>
                    </button>
                  ))}

              )}
            </div>
            {teacherId && <p className="text-xs text-brand-success mt-1.5 flex items-center gap-1"><IconCheckCircle size={12}/>Assigned to {staffList.find(s => s.id === teacherId)?.fullName}</p>}
          </FormField>

          <div className="grid grid-cols-2 gap-3">
            <FormField label="Deadline Date" error={errors.deadlineDate}>
              <input type="date" className={inputClass} value={deadlineDate} onChange={(e) => setDeadlineDate(e.target.value)} />
            </FormField>

const NOTIFICATION_TABS = ["All", "Pending", "Due", "Sent", "Cancelled", "Failed"];

/* Classifies an existing activity entry into a module for filtering — inferred from its icon/text
   rather than a stored field, so no existing logActivity call sites needed to change. */
const classifyActivity = (a) => {
  const t = a.text.toLowerCase();
  if (/excel (import|sync)/.test(t)) return "Excel Import/Sync";
  if (/staff member/.test(t)) return "Staff";
  if (/reminder|notification/.test(t)) return "Notifications";
  if (/submission/.test(t)) return "Question Submissions";
  if (/examination|invigilat|timetable|venue/.test(t)) return "Examinations";
  return "System";
};

/* Actor shown in the audit trail — there is no authentication yet, so every human-triggered action is
   attributed to "Admin"; automated engine output (reminders firing, Excel sync summaries) is "System". */
const getActivityActor = (a) => /reminder sent|excel (import|sync) (started|completed)/i.test(a.text) ? "System" : "Admin";

const ActivityPage = ({ openModal, notifications, activityLog, storageOk, onResetLocalData, reminders, examsList, submissionsList, staffList, demoClock, onAdvanceClock, onProcessDue, dueReminderCount }) => {
  const [tab, setTab] = useState("All");
  const [auditTab, setAuditTab] = useState("All");
  const [auditQuery, setAuditQuery] = useState("");

  const pendingCount = reminders.filter(r => getReminderDisplayStatus(r, demoClock) === "Pending").length;
  const dueCount = reminders.filter(r => getReminderDisplayStatus(r, demoClock) === "Due").length;
  const cancelledCount = reminders.filter(r => r.status === "Cancelled").length;
  const sentCount = reminders.filter(r => r.status === "Sent").length;
  const failedCount = reminders.filter(r => r.status === "Failed").length + notifications.filter(n => n.status === "Failed").length;

  const reminderRows = reminders.map(r => {
    const staff = staffList.find(s => s.id === r.invigilatorId);
    const displayStatus = getReminderDisplayStatus(r, demoClock);
    if (r.kind === "submission") {
      const submission = submissionsList.find(s => s.id === r.submissionId);
      return {
        id: `reminder-${r.id}`, recipient: staff ? staff.fullName : "Unknown", type: r.label,
        examLabel: submission ? `${submission.subject} — ${submission.class}` : "Unknown submission",
        message: submission ? buildSubmissionReminderMessage(r.type, submission) : "",
        scheduledTime: r.scheduledAt, sentTime: r.sentAt, status: displayStatus, channel: r.channel || "Demo WhatsApp",
      };
    }
    const exam = examsList.find(e => e.id === r.examId);
    return {
      id: `reminder-${r.id}`, recipient: staff ? staff.fullName : "Unknown", type: r.label,
      examLabel: exam ? `${exam.subject} — ${exam.className}` : "Unknown examination",
      message: exam ? buildInvigilationReminderMessage(r.type, exam) : "",
      scheduledTime: r.scheduledAt, sentTime: r.sentAt, status: displayStatus, channel: r.channel || "Demo WhatsApp",
    };
  }).filter(row => row.status !== "Sent"); // Sent reminders appear as real notification records below.

  const notificationRows = notifications.map(n => ({
    id: `note-${n.id}`, recipient: n.recipientName || n.message, type: n.type || "Notification",
    examLabel: n.examLabel || "—", message: n.fullMessage || n.message,
    scheduledTime: n.scheduledTime, sentTime: n.sentAt, status: n.status, channel: n.channel || "Demo WhatsApp",
  }));

  const allRows = [...reminderRows, ...notificationRows];
  const filteredRows = (tab === "All" ? allRows : allRows.filter(r => r.status === tab))
    .sort((a, b) => new Date(b.sentTime || b.scheduledTime || 0) - new Date(a.sentTime || a.scheduledTime || 0));

  const q = auditQuery.trim().toLowerCase();
  const filteredAudit = activityLog
    .filter(a => auditTab === "All" || classifyActivity(a) === auditTab)
    .filter(a => !q || a.text.toLowerCase().includes(q));

  return (
    <div className="space-y-4">
      <Card className="p-4 sm:p-5">
        <SectionHeader title="Reminder Engine" subtitle="Advance the Demo Clock to test invigilation reminders — this never changes any examination's scheduled time." />
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          <DemoClockPanel demoClock={demoClock} onAdvance={onAdvanceClock} onProcessDue={onProcessDue} dueCount={dueReminderCount} variant="dark" />
          <div className="grid grid-cols-3 sm:grid-cols-5 gap-2">
            {[["Pending", pendingCount, "blue"], ["Due", dueCount, "warning"], ["Sent", sentCount, "success"], ["Cancelled", cancelledCount, "slate"], ["Failed", failedCount, "danger"]].map(([label, value, color]) => (
              <div key={label} className={`rounded-xl px-2 py-2.5 text-center ${colorMap[color].bg}`}>
                <div className={`text-lg font-extrabold ${colorMap[color].text}`}>{value}</div>
                <div className="text-[10px] text-slate-500 font-semibold">{label}</div>
              </div>
            ))}
          </div>
        </div>
      </Card>

      <Card className="p-4 sm:p-5">
        <SectionHeader title="Notification Center" subtitle="Every simulated notification EduSync has generated or scheduled — Demo channel only." />
        <div className="flex items-start gap-2 bg-brand-orange/5 border border-brand-orange/20 rounded-xl px-3.5 py-2.5 text-xs text-slate-600 mb-4 leading-relaxed">
          <IconInfo size={14} className="text-brand-orange flex-shrink-0 mt-0.5" />
          This is simulated delivery only — no real WhatsApp or SMS messages are sent. Every record here is a "Demo WhatsApp" notification.
        </div>
        <div className="flex items-center gap-1 bg-slate-100 rounded-xl p-1 mb-4 overflow-x-auto">
          {NOTIFICATION_TABS.map(t => (
            <button key={t} onClick={() => setTab(t)}
              className={`focus-ring flex-shrink-0 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors duration-150 ${tab === t ? "bg-white text-slate-800 shadow-sm" : "text-slate-500 hover:text-slate-700"}`}>
              {t}
            </button>
          ))}
        </div>
        {filteredRows.length === 0 ? (
          <EmptyState icon={IconBell} color="orange" title="Nothing here yet" description="Simulated notifications will appear here as reminders come due or timetable changes happen." />
        ) : (
          <div className="space-y-2 max-h-96 overflow-y-auto pr-1">
            {filteredRows.slice(0, 60).map(row => (
              <div key={row.id} className="border border-slate-100 rounded-xl p-3">
                <div className="flex items-start justify-between gap-2 flex-wrap">
                  <div className="min-w-0">
                    <div className="text-sm font-semibold text-slate-800 truncate">{row.recipient}</div>
                    <div className="text-xs text-slate-400 mt-0.5">{row.type} · {row.examLabel}</div>
                  </div>
                  <StatusBadge status={row.status} />
                </div>
                <p className="text-xs text-slate-500 mt-2 leading-relaxed">{row.message}</p>
                <div className="flex flex-wrap items-center gap-x-3 gap-y-1 text-[11px] text-slate-400 mt-2">
                  <span className="flex items-center gap-1"><IconClock size={11}/>{row.scheduledTime ? formatDateTimeDisplay(row.scheduledTime) : "—"}</span>
                  {row.sentTime && <span className="flex items-center gap-1"><IconCheckCircle size={11}/>Sent {formatDateTimeDisplay(row.sentTime)}</span>}
                  <span className="sm:ml-auto font-semibold text-slate-500">{row.channel} · Demo Notification</span>
                </div>
              </div>
            ))}
          </div>
        )}
      </Card>

      <Card className="p-4 sm:p-5">
        <SectionHeader title="Local Data" subtitle="EduSync saves its data locally in this browser — nothing is sent to a server or shared with other devices." />
        <div className="flex items-center justify-between gap-3 flex-wrap">
          <div className={`flex items-center gap-2 text-sm ${storageOk ? "text-brand-success" : "text-brand-danger"}`}>
            <IconContainer icon={storageOk ? IconCheckCircle : IconAlertTriangle} color={storageOk ? "success" : "danger"} size="sm" />
            {storageOk ? "Saved locally on this device" : "Local storage is unavailable. Your changes may not survive a page reload."}
          </div>
          <Button variant="secondary" icon={IconSync} onClick={onResetLocalData}>Reset Local Data</Button>
        </div>
      </Card>

      <Card className="p-4 sm:p-5">
        <SectionHeader title="Notification Log" subtitle="A record of every simulated message sent by EduSync" />
        <div className="space-y-2">
          {notifications.map(n => (
            <div key={n.id} className="flex items-center justify-between gap-3 p-3.5 rounded-xl border border-slate-100 hover:border-slate-200 transition-colors duration-150">
              <div className="flex items-center gap-3 min-w-0">
                <IconContainer icon={IconBell} color="orange" size="sm" />
                <div className="min-w-0">
                  <div className="font-semibold text-slate-800 text-sm truncate">{n.message}</div>
                  <div className="text-xs text-slate-400 mt-0.5">{n.time} · {n.channel || "Demo WhatsApp"}</div>
                </div>
              </div>
              <StatusBadge status={n.status} />
            </div>
          ))}
        </div>
      </Card>

      <Card className="p-4 sm:p-5">
        <SectionHeader title="Activity / Audit Log" subtitle="A record of every important change across EduSync — newest first" />
        <div className="flex flex-col sm:flex-row gap-3 mb-4">
          <div className="relative flex-1">
            <IconSearch size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
            <input value={auditQuery} onChange={(e) => setAuditQuery(e.target.value)} placeholder="Search activity"
              className="w-full pl-9 pr-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-blue/40 focus:border-brand-blue transition-colors duration-150" />
          </div>
        </div>
        <div className="flex items-center gap-1 bg-slate-100 rounded-xl p-1 mb-4 overflow-x-auto">
          {ACTIVITY_TABS.map(t => (
            <button key={t} onClick={() => setAuditTab(t)}
              className={`focus-ring flex-shrink-0 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors duration-150 ${auditTab === t ? "bg-white text-slate-800 shadow-sm" : "text-slate-500 hover:text-slate-700"}`}>
              {t}
            </button>
          ))}
        </div>
        {filteredAudit.length === 0 ? (
          <EmptyState icon={IconActivity} color="orange" title="No activity yet" description="Actions you take will appear here." />
        ) : (
          <div className="space-y-2 max-h-96 overflow-y-auto pr-1">
            {filteredAudit.slice(0, 100).map(a => (
              <div key={a.id} className="flex items-start gap-3 p-3 rounded-xl border border-slate-100">
                <IconContainer icon={resolveIcon(a.iconKey)} color={a.color} size="sm" />
                <div className="flex-1 min-w-0">
                  <div className="text-sm text-slate-700">{a.text}</div>
                  <div className="flex items-center gap-2 text-xs text-slate-400 mt-1 flex-wrap">
                    <span>{a.time}</span>
                    <span className="text-slate-300">·</span>
                    <span className="font-semibold text-slate-500">{getActivityActor(a)}</span>
                    <span className="text-slate-300">·</span>
                    <span>{classifyActivity(a)}</span>
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
      </Card>

      <ShellPage icon={IconActivity} color="orange" title="Real WhatsApp delivery is coming in a future build stage"
        description="This engine is fully functional as a simulation — connecting a real WhatsApp/SMS channel is the next step."
        actionLabel="Send Announcement" openModal={openModal} modalTitle="Send Announcement" />
    </div>
  );
};

/* ============================= APP SHELL ============================= */
function App() {
  const [page, setPage] = useState("dashboard");

  const [modal, setModal] = useState(null);
  const openModal = (a) => setModal({ title: a.modalTitle || a.label, icon: a.icon || IconSync, color: a.color || "blue" });
  const closeModal = () => setModal(null);

  const [boot] = useState(bootstrapEduSyncData);
  const [staffList, setStaffList] = useState(boot.staff);
  const [examsList, setExamsList] = useState(boot.exams);
  const [submissionsList, setSubmissionsList] = useState(boot.submissions);
  const [reminders, setReminders] = useState(boot.reminders);
  const [notifications, setNotifications] = useState(boot.notifications);
  const [activityLog, setActivityLog] = useState(boot.activity);
  const [demoClock, setDemoClock] = useState(boot.demoClock);
  const [storageOk, setStorageOk] = useState(boot.storageOk);
  const [toast, setToast] = useState("");

  useEffect(() => { if (storageOk) saveSettings({ demoClock: demoClock.toISOString() }); }, [demoClock]);
  useEffect(() => { if (storageOk) setStorageOk(saveSubmissions(submissionsList)); }, [submissionsList]);

  const [staffForm, setStaffForm] = useState(null);
  const [staffProfile, setStaffProfile] = useState(null);
  const [examForm, setExamForm] = useState(null);
  const [examView, setExamView] = useState(null);
  const [rescheduleExam, setRescheduleExam] = useState(null);
  const [submissionForm, setSubmissionForm] = useState(null);
  const [confirmDialog, setConfirmDialog] = useState(null);
  const [excelWorkflow, setExcelWorkflow] = useState(null); // 'import' | 'sync' | null

  /* ---- Persistence: Application State → Storage, automatically, on every change ---- */
  useEffect(() => { if (storageOk) setStorageOk(saveStaff(staffList)); }, [staffList]);
  useEffect(() => { if (storageOk) setStorageOk(saveExaminations(examsList)); }, [examsList]);
  useEffect(() => { if (storageOk) setStorageOk(saveReminders(reminders)); }, [reminders]);
  useEffect(() => { if (storageOk) setStorageOk(saveNotifications(notifications)); }, [notifications]);
  useEffect(() => { if (storageOk) setStorageOk(saveActivities(activityLog)); }, [activityLog]);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(""), 3500); };
  const logActivity = (text, iconKey, color, meta = {}) =>
    setActivityLog(prev => [{ id: Date.now() + Math.random(), text, iconKey, color, time: "Just now", ...meta }, ...prev]);

  /* ---- Staff handlers ---- */
  const openAddStaff = () => setStaffForm({ mode: "add", staff: null });
  const openEditStaff = (staff) => { setStaffProfile(null); setStaffForm({ mode: "edit", staff }); };
  const openViewStaff = (staff) => setStaffProfile(staff);

  const handleStaffFormSubmit = (data) => {
    if (staffForm.mode === "edit") {
      const id = staffForm.staff.id;
      setStaffList(prev => prev.map(s => s.id === id ? { ...s, ...data, updatedAt: new Date().toISOString().slice(0, 10) } : s));
      logActivity(`Staff member updated: ${data.fullName}`, "edit", "blue");
      showToast("Staff details updated.");
    } else {
      const now = new Date().toISOString().slice(0, 10);
      const newStaff = { id: Date.now(), ...data, status: "Active", createdAt: now, updatedAt: now };
      setStaffList(prev => [...prev, newStaff]);
      logActivity(`Staff member added: ${data.fullName}`, "userPlus", "teal");
      showToast("Staff member added.");
    }
    setStaffForm(null);
  };

  const askDeactivate = (staff) => { setStaffProfile(null); setConfirmDialog({ type: "deactivate", staff }); };
  const askReactivate = (staff) => { setStaffProfile(null); setConfirmDialog({ type: "reactivate", staff }); };
  const askSendTest = (staff) => setConfirmDialog({ type: "test", staff });

  /* ---- Reminder sync — the seam the future notification engine will plug into ---- */
  const syncReminders = (prevExam, newExam) => {
    setReminders(prev => {
      let next = prev;
      if (newExam.status === "Cancelled") {
        return next.map(r => r.examId === newExam.id && r.status === "Pending" ? { ...r, status: "Cancelled" } : r);
      }
      const timeChanged = !prevExam || prevExam.date !== newExam.date || prevExam.startTime !== newExam.startTime || prevExam.endTime !== newExam.endTime;
      if (timeChanged) {
        next = next.map(r => r.examId === newExam.id && r.status === "Pending" ? { ...r, status: "Cancelled" } : r);
        return [...next, ...buildReminders(newExam)];
      }
      const prevIds = prevExam ? prevExam.invigilatorIds : [];
      const removedIds = prevIds.filter(id => !newExam.invigilatorIds.includes(id));
      const addedIds = newExam.invigilatorIds.filter(id => !prevIds.includes(id));
      if (removedIds.length) {
        next = next.map(r => r.examId === newExam.id && removedIds.includes(r.invigilatorId) && r.status === "Pending" ? { ...r, status: "Cancelled" } : r);
      }
      if (addedIds.length) {
        next = [...next, ...buildReminders({ ...newExam, invigilatorIds: addedIds })];
      }
      return next;
    });
  };

  /* Mirrors syncReminders for the single-recipient submission-reminder set: deadline change cancels the
     old (Pending) reminders and generates a fresh, version-bumped set; Completed/Cancelled cancels them
     outright; anything else (subject/class/notes edits) leaves the schedule untouched. */
  const syncSubmissionReminders = (prevSub, newSub) => {
    setReminders(prev => {
      const isSubReminder = r => r.kind === "submission" && r.submissionId === newSub.id;
      if (newSub.status === "Cancelled" || newSub.status === "Completed") {
        return prev.map(r => isSubReminder(r) && r.status === "Pending" ? { ...r, status: "Cancelled" } : r);
      }
      const deadlineChanged = !prevSub || prevSub.deadlineDate !== newSub.deadlineDate || prevSub.deadlineTime !== newSub.deadlineTime;
      if (deadlineChanged) {
        const cancelled = prev.map(r => isSubReminder(r) && r.status === "Pending" ? { ...r, status: "Cancelled" } : r);
        return [...cancelled, ...buildSubmissionReminders(newSub)];
      }
      return prev;
    });
  };

  /* ---- Question Submission handlers ---- */
  const openAddSubmission = () => setSubmissionForm({ mode: "add", submission: null });
  const openEditSubmission = (submission) => setSubmissionForm({ mode: "edit", submission });

  const handleSubmissionFormSubmit = (data) => {
    const now = new Date().toISOString().slice(0, 10);
    if (submissionForm.mode === "edit") {
      const prev = submissionForm.submission;
      const deadlineChanged = prev.deadlineDate !== data.deadlineDate || prev.deadlineTime !== data.deadlineTime;
      const scheduleVersion = deadlineChanged ? (prev.scheduleVersion || 1) + 1 : (prev.scheduleVersion || 1);
      const updated = { ...prev, ...data, scheduleVersion, updatedAt: now };
      setSubmissionsList(list => list.map(s => s.id === prev.id ? updated : s));
      syncSubmissionReminders(prev, updated);
      if (deadlineChanged) {
        logActivity(`Question submission deadline changed: ${updated.subject} (${updated.class}) → ${formatDateDisplay(updated.deadlineDate)} ${formatTime12(updated.deadlineTime)}`, "sync", "info", { submissionId: updated.id, staffId: updated.teacherId });
      } else {
        logActivity(`Question submission updated: ${updated.subject} (${updated.class})`, "edit", "purple", { submissionId: updated.id, staffId: updated.teacherId });
      }
      showToast("Question submission updated.");
    } else {
      const newSub = { id: Date.now(), ...data, status: "Upcoming", scheduleVersion: 1, createdAt: now, updatedAt: now };
      setSubmissionsList(list => [...list, newSub]);
      syncSubmissionReminders(null, newSub);
      logActivity(`Question submission created: ${newSub.subject} (${newSub.class}) — ${newSub.teacherName}`, "fileText", "purple", { submissionId: newSub.id, staffId: newSub.teacherId });
      logActivity(`Reminder schedule generated: ${newSub.subject} (${newSub.class}) submission`, "bell", "orange", { submissionId: newSub.id });
      showToast("Question submission added.");
    }
    setSubmissionForm(null);
  };

  const askCompleteSubmission = (submission) => setConfirmDialog({ type: "completeSubmission", submission });
  const askCancelSubmission = (submission) => setConfirmDialog({ type: "cancelSubmission", submission });

  /* ---- Examination handlers ---- */
  const openAddExam = () => setExamForm({ mode: "add", exam: null });
  const openEditExam = (exam) => { setExamView(null); setExamForm({ mode: "edit", exam }); };
  const openViewExam = (exam) => setExamView(exam);
  const openRescheduleExam = (exam) => { setExamView(null); setRescheduleExam(exam); };

  const handleExamFormSubmit = (data) => {
    const now = new Date().toISOString().slice(0, 10);
    const externalKey = buildExternalKey(data.subject, data.className, data.date, data.startTime, data.venue);
    if (examForm.mode === "edit") {
      const prev = examForm.exam;
      const scheduleDiffs = diffExamFields(prev, data);
      const scheduleVersion = scheduleDiffs.some(d => d.kind === "schedule") ? (prev.scheduleVersion || 1) + 1 : (prev.scheduleVersion || 1);
      const updated = { ...prev, ...data, externalKey, scheduleVersion, updatedAt: now };
      setExamsList(list => list.map(e => e.id === prev.id ? updated : e));
      syncReminders(prev, updated);
      logActivity(`Examination updated: ${updated.subject} (${updated.className})`, "edit", "blue", { examId: prev.id });

      if (scheduleDiffs.length && updated.status === "Scheduled") {
        const notes = broadcastToActiveStaff(staffList, updated, "Timetable Change", buildTimetableChangeMessage(updated, scheduleDiffs), demoClock);
        setNotifications(prevN => [...notes, ...prevN]);
        logActivity(`Timetable change notification sent to ${notes.length} active staff member${notes.length === 1 ? "" : "s"}`, "sync", "info", { examId: updated.id });
      }
      const addedIds = updated.invigilatorIds.filter(id => !prev.invigilatorIds.includes(id));
      const removedIds = prev.invigilatorIds.filter(id => !updated.invigilatorIds.includes(id));
      if (addedIds.length || removedIds.length) {
        const assignNotes = sendAssignmentChangeNotifications(updated, staffList, addedIds, removedIds, demoClock);
        setNotifications(prevN => [...assignNotes, ...prevN]);
      }
      showToast("Examination updated.");
    } else {
      const newExam = { id: Date.now(), ...data, externalKey, scheduleVersion: 1, status: "Scheduled", source: "Manual", createdAt: now, updatedAt: now };
      setExamsList(list => [...list, newExam]);
      syncReminders(null, newExam);
      logActivity(`Examination created: ${newExam.subject} (${newExam.className})`, "calendar", "blue", { examId: newExam.id });
      showToast("Examination added.");
    }
    setExamForm(null);
  };

  const handleRescheduleSubmit = (data) => {
    const prev = rescheduleExam;
    const now = new Date().toISOString().slice(0, 10);
    const externalKey = buildExternalKey(prev.subject, prev.className, data.date, data.startTime, data.venue);
    const scheduleDiffs = diffExamFields(prev, data);
    if (scheduleDiffs.length === 0) {
      showToast("No changes to save.");
      setRescheduleExam(null);
      return;
    }
    const scheduleVersion = scheduleDiffs.some(d => d.kind === "schedule") ? (prev.scheduleVersion || 1) + 1 : (prev.scheduleVersion || 1);
    const updated = { ...prev, ...data, externalKey, scheduleVersion, updatedAt: now };
    setExamsList(list => list.map(e => e.id === prev.id ? updated : e));
    syncReminders(prev, updated);
    logActivity(`Examination rescheduled: ${updated.subject} (${updated.className}) → ${formatDateDisplay(updated.date)}, ${formatTimeRange(updated.startTime, updated.endTime)}`, "sync", "info", { examId: prev.id });
    const notes = broadcastToActiveStaff(staffList, updated, "Timetable Change", buildTimetableChangeMessage(updated, scheduleDiffs), demoClock);
    setNotifications(prevN => [...notes, ...prevN]);
    logActivity(`Timetable change notification sent to ${notes.length} active staff member${notes.length === 1 ? "" : "s"}`, "sync", "info", { examId: updated.id });
    showToast("Examination rescheduled.");
    setRescheduleExam(null);
  };

  const askCancelExam = (exam) => { setExamView(null); setConfirmDialog({ type: "cancelExam", exam }); };
  const askDeleteExam = (exam) => { setExamView(null); setConfirmDialog({ type: "deleteExam", exam }); };
  const askResetLocalData = () => setConfirmDialog({ type: "resetLocalData" });

  /* ---- Demo Clock: simulated "current time" only — never rewrites examination schedules ---- */
  const advanceDemoClock = (ms) => setDemoClock(prev => new Date(prev.getTime() + ms));

  const handleProcessDueReminders = () => {
    const { updatedReminders, newNotifications, activityEntries } = processDueReminders(reminders, examsList, submissionsList, staffList, demoClock);
    if (newNotifications.length === 0) { showToast("No reminders are due yet."); return; }
    setReminders(updatedReminders);
    setNotifications(prev => [...newNotifications, ...prev]);
    activityEntries.forEach(a => logActivity(a.text, a.iconKey, a.color, { examId: a.examId, submissionId: a.submissionId, staffId: a.staffId }));
    showToast(`${newNotifications.length} due reminder${newNotifications.length === 1 ? "" : "s"} processed.`);
  };

  /* ---- Excel Import / Sync handlers ---- */
  const openImportExcel = () => { logActivity("Excel import started", "upload", "blue"); setExcelWorkflow("import"); };
  const openSyncExcel = () => { logActivity("Excel sync started", "repeat", "teal"); setExcelWorkflow("sync"); };

  const handleConfirmImport = (rowsToImport) => {
    const now = new Date().toISOString().slice(0, 10);
    let nextId = Date.now();
    rowsToImport.forEach((r, i) => {
      const newExam = {
        id: nextId + i, subject: r.subject, className: r.className, date: r.date, startTime: r.startTime, endTime: r.endTime,
        venue: r.venue, invigilatorIds: r.invigilatorIds, notes: "", status: "Scheduled", source: "Excel Import", scheduleVersion: 1,
        externalKey: buildExternalKey(r.subject, r.className, r.date, r.startTime, r.venue), createdAt: now, updatedAt: now,
      };
      setExamsList(list => [...list, newExam]);
      syncReminders(null, newExam);
      logActivity(`Examination imported: ${newExam.subject} (${newExam.className})`, "upload", "blue", { examId: newExam.id });
    });
    logActivity(`Excel import completed: ${rowsToImport.length} examination${rowsToImport.length === 1 ? "" : "s"} imported`, "checkCircle", "success");
    showToast(`${rowsToImport.length} examination${rowsToImport.length === 1 ? "" : "s"} imported.`);
    setExcelWorkflow(null);
  };

  const handleConfirmSync = (rowsToApply, removedList) => {
    let newCount = 0, changedCount = 0, cancelledCount = 0;
    const now = new Date().toISOString().slice(0, 10);
    let nextId = Date.now();
    let allNotifications = [];

    rowsToApply.forEach((r, i) => {
      if (r.status === "new") {
        const newExam = {
          id: nextId + i, subject: r.subject, className: r.className, date: r.date, startTime: r.startTime, endTime: r.endTime,
          venue: r.venue, invigilatorIds: r.invigilatorIds, notes: "", status: "Scheduled", source: "Excel Sync", scheduleVersion: 1,
          externalKey: buildExternalKey(r.subject, r.className, r.date, r.startTime, r.venue), createdAt: now, updatedAt: now,
        };
        setExamsList(list => [...list, newExam]);
        syncReminders(null, newExam);
        logActivity(`Examination imported: ${newExam.subject} (${newExam.className})`, "upload", "blue", { examId: newExam.id });
        newCount++;
      } else if (r.status === "changed" && r.matchExam) {
        const prev = r.matchExam;
        const scheduleOrVenueDiffs = r.diff.filter(d => d.kind === "schedule" || d.kind === "venue");
        const scheduleVersion = r.diff.some(d => d.kind === "schedule") ? (prev.scheduleVersion || 1) + 1 : (prev.scheduleVersion || 1);
        const updated = {
          ...prev, date: r.date, startTime: r.startTime, endTime: r.endTime, venue: r.venue, invigilatorIds: r.invigilatorIds, scheduleVersion,
          externalKey: buildExternalKey(r.subject, r.className, r.date, r.startTime, r.venue), updatedAt: now,
        };
        setExamsList(list => list.map(e => e.id === prev.id ? updated : e));
        syncReminders(prev, updated);
        r.diff.forEach(d => {
          if (d.kind === "schedule") logActivity(`Timetable changed: ${updated.subject} (${updated.className}) — ${d.from} → ${d.to}`, "sync", "info", { examId: prev.id });
          else if (d.kind === "venue") logActivity(`Venue changed: ${updated.subject} (${updated.className}) — ${d.from} → ${d.to}`, "mapPin", "teal", { examId: prev.id });
          else if (d.kind === "invigilator") logActivity(`Invigilator changed: ${updated.subject} (${updated.className}) — ${d.from} → ${d.to}`, "users", "teal", { examId: prev.id });
        });
        if (scheduleOrVenueDiffs.length) {
          const notes = broadcastToActiveStaff(staffList, updated, "Timetable Change", buildTimetableChangeMessage(updated, scheduleOrVenueDiffs), demoClock);
          allNotifications = [...notes, ...allNotifications];
        }
        const addedIds = updated.invigilatorIds.filter(id => !prev.invigilatorIds.includes(id));
        const removedIds = prev.invigilatorIds.filter(id => !updated.invigilatorIds.includes(id));
        if (addedIds.length || removedIds.length) {
          const assignNotes = sendAssignmentChangeNotifications(updated, staffList, addedIds, removedIds, demoClock);
          allNotifications = [...assignNotes, ...allNotifications];
        }
        changedCount++;
      }
    });

    removedList.forEach(r => {
      if (r.decision === "cancel") {
        const exam = examsList.find(e => e.id === r.exam.id) || r.exam;
        const updated = { ...exam, status: "Cancelled", updatedAt: now };
        setExamsList(list => list.map(e => e.id === exam.id ? updated : e));
        syncReminders(exam, updated);
        logActivity(`Examination cancelled: ${exam.subject} (${exam.className})`, "xCircle", "danger", { examId: exam.id });
        const notes = broadcastToActiveStaff(staffList, exam, "Examination Cancellation", buildCancellationMessage(exam), demoClock);
        allNotifications = [...notes, ...allNotifications];
        cancelledCount++;
      }
    });

    if (allNotifications.length) setNotifications(prevN => [...allNotifications, ...prevN]);
    logActivity(`Excel sync completed: ${newCount} new, ${changedCount} changed, ${cancelledCount} cancelled`, "repeat", "teal");
    showToast("Sync applied.");
    setExcelWorkflow(null);
  };

  const handleAddInvigilatorToExam = (exam, staffId) => {
    const candidate = { ...exam, invigilatorIds: [...exam.invigilatorIds, staffId] };
    const conflicts = getConflicts(examsList, candidate, staffList);
    if (conflicts.length) {
      logActivity(`Invigilator conflict detected: ${conflicts[0].staffName} — ${exam.subject} vs ${conflicts[0].subject}`, "alertTriangle", "danger", { examId: exam.id });
      showToast(`Cannot add — ${conflicts[0].staffName} already has a duty at that time.`);
      return;
    }
    const now = new Date().toISOString().slice(0, 10);
    const updated = { ...candidate, updatedAt: now };
    setExamsList(list => list.map(e => e.id === exam.id ? updated : e));
    syncReminders(exam, updated);
    const staff = staffList.find(s => s.id === staffId);
    logActivity(`Invigilation assignment added: ${staff ? staff.fullName : "Staff"}`, "userPlus", "teal", { examId: exam.id, staffId });
    if (staff) setNotifications(prevN => [makeNotification({ staff, type: "Invigilator Assignment Change", exam: updated, message: buildAssignmentAddedMessage(updated), scheduledTime: demoClock, sentAt: demoClock }), ...prevN]);
    showToast("Invigilator added.");
    setExamView(updated);
  };

  const handleRemoveInvigilatorFromExam = (exam, staffId) => {
    const now = new Date().toISOString().slice(0, 10);
    const updated = { ...exam, invigilatorIds: exam.invigilatorIds.filter(id => id !== staffId), updatedAt: now };
    setExamsList(list => list.map(e => e.id === exam.id ? updated : e));
    syncReminders(exam, updated);
    const staff = staffList.find(s => s.id === staffId);
    logActivity(`Invigilation assignment removed: ${staff ? staff.fullName : "Staff"}`, "userX", "warning", { examId: exam.id, staffId });
    if (staff) setNotifications(prevN => [makeNotification({ staff, type: "Invigilator Assignment Change", exam, message: buildAssignmentRemovedMessage(exam), scheduledTime: demoClock, sentAt: demoClock }), ...prevN]);
    showToast("Invigilator removed.");
    setExamView(updated);
  };

  const handleConfirm = () => {
    if (!confirmDialog) return;
    const { type } = confirmDialog;
    const now = new Date().toISOString().slice(0, 10);

    if (type === "deactivate") {
      const staff = confirmDialog.staff;
      setStaffList(prev => prev.map(s => s.id === staff.id ? { ...s, status: "Deactivated", updatedAt: now } : s));
      logActivity(`Staff member deactivated: ${staff.fullName}`, "userX", "danger");
      showToast(`${staff.fullName} has been deactivated.`);
    } else if (type === "reactivate") {
      const staff = confirmDialog.staff;
      setStaffList(prev => prev.map(s => s.id === staff.id ? { ...s, status: "Active", updatedAt: now } : s));
      logActivity(`Staff member reactivated: ${staff.fullName}`, "userCheck", "success");
      showToast(`${staff.fullName} has been reactivated.`);
    } else if (type === "test") {
      const staff = confirmDialog.staff;
      setNotifications(prev => [{ id: Date.now(), message: `Test WhatsApp sent to ${staff.fullName} (${staff.whatsappNumber})`, fullMessage: buildTestWhatsAppMessage(staff), time: "Just now", status: "Sent", channel: "Demo WhatsApp", isTest: true }, ...prev]);
      logActivity(`Test WhatsApp sent to: ${staff.fullName}`, "send", "orange");
      showToast("Test WhatsApp sent successfully.");
    } else if (type === "cancelExam") {
      const exam = examsList.find(e => e.id === confirmDialog.exam.id) || confirmDialog.exam;
      if (exam.status === "Cancelled") { showToast("This examination is already cancelled."); setConfirmDialog(null); return; }
      const updated = { ...exam, status: "Cancelled", updatedAt: now };
      setExamsList(list => list.map(e => e.id === exam.id ? updated : e));
      syncReminders(exam, updated);
      logActivity(`Examination cancelled: ${exam.subject} (${exam.className})`, "xCircle", "danger", { examId: exam.id });
      const notes = broadcastToActiveStaff(staffList, exam, "Examination Cancellation", buildCancellationMessage(exam), demoClock);
      setNotifications(prevN => [...notes, ...prevN]);
      logActivity(`Cancellation notification sent to ${notes.length} active staff member${notes.length === 1 ? "" : "s"}`, "xCircle", "danger", { examId: exam.id });
      showToast("Examination cancelled.");
    } else if (type === "deleteExam") {
      const exam = examsList.find(e => e.id === confirmDialog.exam.id) || confirmDialog.exam;
      if (exam.status !== "Cancelled") { showToast("Only cancelled examinations can be deleted."); setConfirmDialog(null); return; }
      setExamsList(list => list.filter(e => e.id !== exam.id));
      setReminders(list => list.filter(r => r.examId !== exam.id));
      logActivity(`Cancelled examination deleted: ${exam.subject} (${exam.className})`, "trash", "danger", { examId: exam.id });
      showToast("Cancelled examination deleted.");
    } else if (type === "completeSubmission") {
      const sub = confirmDialog.submission;
      const updated = { ...sub, status: "Completed", updatedAt: now };
      setSubmissionsList(list => list.map(s => s.id === sub.id ? updated : s));
      syncSubmissionReminders(sub, updated);
      logActivity(`Question submission completed: ${sub.subject} (${sub.class}) — ${sub.teacherName}`, "checkCircle", "success", { submissionId: sub.id, staffId: sub.teacherId });
      showToast("Question submission marked completed.");
    } else if (type === "cancelSubmission") {
      const sub = confirmDialog.submission;
      const updated = { ...sub, status: "Cancelled", updatedAt: now };
      setSubmissionsList(list => list.map(s => s.id === sub.id ? updated : s));
      syncSubmissionReminders(sub, updated);
      logActivity(`Question submission cancelled: ${sub.subject} (${sub.class}) — ${sub.teacherName}`, "xCircle", "danger", { submissionId: sub.id, staffId: sub.teacherId });
      showToast("Question submission cancelled.");
    } else if (type === "resetLocalData") {
      const fresh = resetEduSyncToDemoData();
      setStaffList(fresh.staff);
      setExamsList(fresh.exams);
      setSubmissionsList(fresh.submissions);
      setReminders(fresh.reminders);
      setNotifications(fresh.notifications);
      setActivityLog([{ id: Date.now() + Math.random(), text: "Local data reset to the original demo dataset", iconKey: "sync", color: "warning", time: "Just now" }]);
      setDemoClock(fresh.demoClock);
      setStorageOk(true);
      showToast("Local data has been reset to the demo dataset.");
    }
    setConfirmDialog(null);
  };

  const meta = PAGE_META[page];
  const today = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  const dueReminderCount = reminders.filter(r => r.status === "Pending" && r.scheduledAt <= demoClock).length;

  const renderPage = () => {
    switch (page) {
      case "dashboard": return (
        <DashboardPage examsList={examsList} staffList={staffList} notifications={notifications} activityLog={activityLog}
          reminders={reminders} demoClock={demoClock} submissionsList={submissionsList}
          onAddExam={openAddExam} onNavigate={setPage} onViewExam={openViewExam} openModal={openModal} />
      );
      case "examinations": return (
        <ExaminationsPage examsList={examsList} staffList={staffList}
          onAdd={openAddExam} onView={openViewExam} onEdit={openEditExam} onReschedule={openRescheduleExam} onCancel={askCancelExam} onDelete={askDeleteExam}
          onImportExcel={openImportExcel} onSyncExcel={openSyncExcel} />
      );
      case "staff": return (
        <StaffPage staffList={staffList} examsList={examsList}
          onAddStaff={openAddStaff} onViewStaff={openViewStaff} onEditStaff={openEditStaff}
          onDeactivate={askDeactivate} onReactivate={askReactivate} onSendTest={askSendTest} />
      );
      case "submissions": return (
        <SubmissionsPage submissionsList={submissionsList} reminders={reminders} demoClock={demoClock}
          onAdd={openAddSubmission} onEdit={openEditSubmission} onComplete={askCompleteSubmission} onCancel={askCancelSubmission} />
      );
      case "activity": return (
        <ActivityPage openModal={openModal} notifications={notifications} activityLog={activityLog} storageOk={storageOk} onResetLocalData={askResetLocalData}
          reminders={reminders} examsList={examsList} submissionsList={submissionsList} staffList={staffList} demoClock={demoClock}
          onAdvanceClock={advanceDemoClock} onProcessDue={handleProcessDueReminders} dueReminderCount={dueReminderCount} />
      );
      default: return null;
    }
  };

  const confirmCopy = () => {
    if (!confirmDialog) return {};
    if (confirmDialog.type === "test") {
      const name = confirmDialog.staff.fullName;
      return { icon: IconSend, color: "orange", title: `Send a test WhatsApp notification to ${name}?`,
        message: "EduSync will simulate sending a WhatsApp message. There is no real WhatsApp API connected yet in this build.",
        confirmLabel: "Send Test" };
    }
    if (confirmDialog.type === "reactivate") {
      const name = confirmDialog.staff.fullName;
      return { icon: IconUserCheck, color: "success", title: `Reactivate ${name}?`,
        message: "This staff member will become active again.",
        note: "Once reactivated, they can be selected for future examination duties and will again receive automatic notifications.",
        confirmLabel: "Reactivate Staff" };
    }
    if (confirmDialog.type === "deactivate") {
      const name = confirmDialog.staff.fullName;
      return { icon: IconUserX, color: "danger", title: `Deactivate ${name}?`,
        message: "Deactivated staff cannot be assigned to new examination duties or receive new automatic notifications. Their previous records will remain available.",
        confirmLabel: "Deactivate Staff" };
    }
    if (confirmDialog.type === "cancelExam") {
      const exam = confirmDialog.exam;
      return { icon: IconXCircle, color: "danger", title: `Cancel ${exam.subject} (${exam.className})?`,
        message: "Cancel this examination? The examination will remain in historical records, but future reminders will be cancelled.",
        confirmLabel: "Cancel Examination" };
    }
    if (confirmDialog.type === "deleteExam") {
      const exam = confirmDialog.exam;
      return { icon: IconTrash, color: "danger", title: `Permanently delete ${exam.subject} (${exam.className})?`,
        message: "This is a permanent deletion. This cancelled examination and its remaining reminder records will be removed and cannot be recovered. This does not affect any other examination, staff, question submission, or notification record.",
        confirmLabel: "Delete Permanently" };
    }
    if (confirmDialog.type === "completeSubmission") {
      const sub = confirmDialog.submission;
      return { icon: IconCheckCircle, color: "success", title: `Mark ${sub.subject} (${sub.class}) as Completed?`,
        message: `This will mark the question submission from ${sub.teacherName} as completed and cancel any remaining pending reminders.`,
        confirmLabel: "Mark Completed" };
    }
    if (confirmDialog.type === "cancelSubmission") {
      const sub = confirmDialog.submission;
      return { icon: IconXCircle, color: "danger", title: `Cancel ${sub.subject} (${sub.class}) submission?`,
        message: "This will cancel the question submission and stop any future reminders. The record will remain in history.",
        confirmLabel: "Cancel Submission" };
    }
    if (confirmDialog.type === "resetLocalData") {
      return { icon: IconSync, color: "danger", title: "Reset Local Data?",
        message: "This will remove locally stored EduSync data from this browser and restore the demo dataset. This action cannot be undone.",
        confirmLabel: "Reset Local Data" };
    }
    return {};
  };
  const cc = confirmCopy();

  return (
    <div className="min-h-screen bg-slate-50">
      <aside className="hidden md:flex md:flex-col fixed left-0 top-0 h-full w-64 bg-brand-navy px-4 py-6 z-30">
        <div className="px-2"><Logo variant="light" /></div>
        <nav className="mt-8 flex-1 space-y-1">
          {NAV_ITEMS.map(item => {
            const active = page === item.id;
            return (
              <button key={item.id} onClick={() => setPage(item.id)}
                className={`focus-ring w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition-colors duration-150 ${
                  active ? "bg-brand-blue text-white" : "text-blue-100/80 hover:bg-white/10 hover:text-white"
                }`}>
                <item.icon size={18} className={active ? "text-white" : "text-blue-300"} />
                {item.label}
              </button>
            );
          })}
        </nav>
        <div className="px-2 space-y-3">
          <DemoClockPanel demoClock={demoClock} onAdvance={advanceDemoClock} onProcessDue={handleProcessDueReminders} dueCount={dueReminderCount} variant="light" />
          <div className="text-[11px] text-blue-200/60 leading-relaxed">
            WhatsApp delivery is simulated in this build. Live messaging arrives in a future stage.
          </div>
          <DemoModeBadge />
        </div>
      </aside>

      <div className="md:pl-64 pb-20 md:pb-0">
        <header className="sticky top-0 z-20 bg-slate-50/95 backdrop-blur border-b border-slate-200/80">
          <div className="flex items-center justify-between gap-3 px-4 sm:px-6 py-4">
            <div className="flex items-center gap-3 min-w-0">
              <div className="md:hidden"><Logo compact /></div>
              <div className="min-w-0 md:hidden w-px h-8 bg-slate-200"></div>
              <div className="min-w-0">
                <h1 className="text-xl sm:text-2xl font-extrabold text-slate-900 truncate">{meta.title}</h1>
                <p className="hidden sm:block text-sm text-slate-500 mt-0.5">{meta.subtitle}</p>
              </div>
            </div>
            <div className="flex items-center gap-3 flex-shrink-0">
              <span className="hidden lg:flex items-center gap-1.5 text-xs text-slate-400 font-medium">
                <IconCalendar size={14} />{today}
              </span>
              <div className="md:hidden"><DemoModeBadge /></div>
            </div>
          </div>
        </header>

        {!storageOk && (
          <div className="mx-4 sm:mx-6 mt-4 flex items-start gap-2 bg-brand-danger/5 border border-brand-danger/20 rounded-xl px-3.5 py-3 text-sm text-brand-danger">
            <IconAlertTriangle size={16} className="flex-shrink-0 mt-0.5" />
            Local storage is unavailable. Your changes may not survive a page reload — EduSync will keep working for this session.
          </div>
        )}

        <main className="px-4 sm:px-6 py-6 max-w-6xl">
          {renderPage()}
        </main>
      </div>

      <nav className="md:hidden fixed bottom-0 left-0 right-0 z-30 bg-white border-t border-slate-200 grid grid-cols-5 pb-[env(safe-area-inset-bottom)]">
        {NAV_ITEMS.map(item => {
          const active = page === item.id;
          return (
            <button key={item.id} onClick={() => setPage(item.id)}
              className="focus-ring flex flex-col items-center justify-center gap-1 py-2.5 transition-colors duration-150">
              <div className={`w-9 h-5 rounded-full flex items-center justify-center ${active ? "bg-brand-blue/10" : ""}`}>
                <item.icon size={18} className={active ? "text-brand-blue" : "text-slate-400"} />
              </div>
              <span className={`text-[10px] font-semibold ${active ? "text-brand-blue" : "text-slate-400"}`}>{item.label}</span>
            </button>
          );
        })}
      </nav>

      <Modal open={!!modal} onClose={closeModal} title={modal?.title} color={modal?.color} icon={modal?.icon}
        description={`${modal?.title || "This action"} isn't wired up to real data yet — it's part of EduSync's staged rollout.`} />

      <StaffFormModal open={!!staffForm} mode={staffForm?.mode} initialData={staffForm?.staff} staffList={staffList}
        onClose={() => setStaffForm(null)} onSubmit={handleStaffFormSubmit} />

      <StaffProfileDrawer open={!!staffProfile} staff={staffProfile} examsList={examsList} submissionsList={submissionsList} notifications={notifications} reminders={reminders} demoClock={demoClock}
        onClose={() => setStaffProfile(null)} onEdit={openEditStaff} onDeactivate={askDeactivate} onReactivate={askReactivate} onSendTest={askSendTest} />

      <ExaminationFormModal open={!!examForm} mode={examForm?.mode} initialData={examForm?.exam} examsList={examsList} staffList={staffList}
        onClose={() => setExamForm(null)} onSubmit={handleExamFormSubmit} />

      <SubmissionFormModal open={!!submissionForm} mode={submissionForm?.mode} initialData={submissionForm?.submission} staffList={staffList}
        onClose={() => setSubmissionForm(null)} onSubmit={handleSubmissionFormSubmit} />

      <RescheduleModal open={!!rescheduleExam} exam={rescheduleExam} examsList={examsList} staffList={staffList}
        onClose={() => setRescheduleExam(null)} onSubmit={handleRescheduleSubmit} />

      <ExaminationDetailDrawer open={!!examView} exam={examView} examsList={examsList} staffList={staffList} reminders={reminders} activityLog={activityLog}
        onClose={() => setExamView(null)} onEdit={openEditExam} onReschedule={openRescheduleExam} onCancel={askCancelExam} onDelete={askDeleteExam}
        onAddInvigilator={handleAddInvigilatorToExam} onRemoveInvigilator={handleRemoveInvigilatorFromExam} />

      <ExcelWorkflowModal open={!!excelWorkflow} mode={excelWorkflow} examsList={examsList} staffList={staffList}
        onClose={() => setExcelWorkflow(null)} onConfirmImport={handleConfirmImport} onConfirmSync={handleConfirmSync} />

      <ConfirmDialog open={!!confirmDialog} icon={cc.icon} color={cc.color} title={cc.title} message={cc.message} note={cc.note}
        confirmLabel={cc.confirmLabel} onConfirm={handleConfirm} onCancel={() => setConfirmDialog(null)} />

      <Toast message={toast} onClose={() => setToast("")} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
